# Accao composta: prepara a toolchain para os gates que precisam dela.
#
# Existe para que os jobs do workflow nao repitam seis vezes os mesmos cinco
# passos. Os gates 3 e 9 **nao** a usam: dependem so da biblioteca padrao do
# Python, e dar-lhes a toolchain inteira esconderia essa propriedade — que e
# deliberada e esta registada em `docs/adr/ADR-L001-toolchain.md` §6.

name: preparar
description: Instala Node, pnpm e Python e corre o bootstrap a partir dos lockfiles

runs:
  using: composite
  steps:
    - name: Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version

    - name: pnpm
      # O `packageManager` do package.json fixa a versao **com hash de
      # integridade**, e e o Corepack que o verifica. Nao se declara a versao
      # aqui: declara-la em dois sitios e tê-los a divergir.
      shell: bash
      run: corepack enable

    - name: Python
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: cache do pnpm
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: cache do venv
      uses: actions/cache@v4
      with:
        path: .venv
        # **A versao de patch do interpretador faz parte da chave**, e nao e
        # zelo: um `.venv` leva o `bin/python3` como symlink para o
        # `/opt/hostedtoolcache/Python/<versao>/x64`, logo uma entrada
        # construida com um patch e um symlink pendurado em qualquer runner que
        # sirva outro. O `python-version: "3.12"` flutua no patch de proposito —
        # a imagem dos runners rola sozinha — e sem isto a entrada envenena-se
        # na rolagem e **nao se cura**: o `actions/cache` so escreve quando ha
        # *miss*, e com *hit* restaura o veneno execucao apos execucao.
        #
        # Medido a 2026-11-03, na corrida 41636240093: os sete jobs do `ci.yaml`
        # que usam esta accao apanharam a rolagem a meio — seis em CPython
        # 3.12.15 passaram e o unico em 3.12.16 falhou com
        # `[Errno 2] ... '.venv/bin/python3'`, sobre um cache restaurado a 100%.
        # (A accao tem um oitavo consumidor, o `fatias` do `mutacoes.yaml`, que
        # e uma matriz de seis: 13 jobs ao todo partilham esta entrada.)
        # Apagar a entrada nao corrigia nada **durante a rolagem**: enquanto ha
        # dois patches em servico, nenhuma entrada unica serve os dois lados.
        #
        # **E NAO SE PODE POR `restore-keys` AQUI.** O cache do `pnpm`, logo
        # acima, tem um — e copiar essa linha para ca desfaz tudo isto: a
        # correspondencia por prefixo voltaria a restaurar uma entrada
        # construida noutro patch, que e exactamente o defeito. A ausencia
        # sustenta a correccao, e por isso tem portao proprio no
        # `tools/lint_arch/tests/test_ci_preparar.py`. Achado da revisao
        # adversarial, que a reintroduziu e passou 4/4 antes de haver portao.
        #
        # Os tres ficheiros do `hashFiles` sao os tres pre-requisitos da regra
        # `$(VENV)/.stamp` do `Makefile`, e o portao le-os de la: uma chave que
        # diz indexar «os requirements» e indexa dois de tres e uma chave que
        # mente.
        key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('services/agr/requirements/runtime.txt', 'tools/requirements/tools.txt', 'db/requirements/migrations.txt') }}

    - name: bootstrap
      shell: bash
      # O `make bootstrap` corre o `lint-arch` **antes** de instalar, que e a
      # unica ordem em que a lista de bloqueio serve para algo
      # (`docs/tecnica/08` §4.8).
      run: make bootstrap
