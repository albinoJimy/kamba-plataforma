# Onde o *secret scanning* do GitHub nao olha — KAM-157
#
# **Uma entrada, e so uma.** A pasta do canario do gate 9: a unica area do
# repositorio onde um valor com forma de credencial e permitido, declarada e
# justificada em `ci/secrets-allow.yaml` desde o KAM-002.
#
# ## Porque e que isto existe
#
# O gate 9 prova-se com um canario: ficheiros com segredos de forma real, que o
# teste copia para fora desta pasta e exige que o scanner apanhe. Sem ele, «o
# gate 9 esta verde» diria o mesmo sobre um scanner que funciona e sobre um que
# devolve sempre uma lista vazia.
#
# Num repositorio publico, a *push protection* do GitHub tem uma opiniao sobre
# isso: recusa o `push` com `GH013 — Repository rule violations`, e o desbloqueio
# e manual, por segredo, feito por uma pessoa na interface. O problema nao e o
# `push` que ja passou — e o proximo: cada padrao novo que o scanner aprender
# traz um valor novo ao canario, e para o paro de novo.
#
# ## Porque esta via, e nao o desbloqueio manual
#
# Decisao do fundador, **2026-10-18**: via A. A alternativa — desbloquear a mao
# de cada vez — nao deixa nada escrito no repositorio e cria friccao repetida,
# com uma mensagem que nao explica que e esperado. Friccao repetida ensina a
# ignorar avisos de seguranca, e isso custa de uma maneira dificil de medir.
#
# ## O que isto NAO faz
#
# **Nao torna o canario invisivel ao gate 9.** Sao dois scanners: o do GitHub,
# que deixa de olhar para esta pasta, e o nosso (`tools/scan_secrets`), que
# continua a varre-la — e que, no `make ci-9`, copia estes ficheiros para fora
# da area permitida e exige nove achados ou mais. Hoje da 17.
#
# **Nao cria uma area cega nova.** Alinha o scanner do GitHub com uma excepcao
# que o `ci/secrets-allow.yaml` ja declarava, com razao escrita e verificada por
# maquina. E se as duas listas divergirem, o teste
# `tools/scan_secrets/tests/test_push_protection.py` fica vermelho — porque uma
# area cega que ninguem declarou e precisamente o que esta via nao pode criar.

paths-ignore:
  - "tools/scan_secrets/tests/fixtures/canario/**"
