# Extensoes ao dicionario canonico — gate 3b (KAM-111)
#
# Um nome de tabela, coluna, valor, evento, campo ou tool que o §3 de
# `specs/02_Dicionario_de_Dados_Canonico.md` NAO cobre so passa o gate 3b se
# estiver aqui, com quatro coisas: o nome, o tipo, o ticket que o introduziu e a
# data em que entrou.
#
# Isto NAO e uma lista de dispensas:
#
#   * uma VARIANTE que o dicionario substitui (`valor_kz`, `sig_ok`, …) nao pode
#     ser declarada aqui — o lint recusa o ficheiro;
#   * um nome que o dicionario ja cobre tambem nao (a extensao seria ruido);
#   * uma extensao que nenhuma superficie usa falha o gate (lista que nao apodrece).
#
# A extensao e sempre QUALIFICADA: `tenants.nif` nao torna `nif` valido noutra
# tabela. Como acrescentar uma: `docs/nomes-canonicos.md` §4.
#
# Revisao: o criterio de aceitacao do KAM-111 pede que este ficheiro seja
# revisto pelo Arquitecto de Plataforma. O `CODEOWNERS` atribui-lho; enquanto as
# equipas do GitHub forem proposta, essa revisao nao e imposta por maquina, e
# as entradas abaixo AGUARDAM essa revisao.
#
# As 20 entradas sao as colunas da revisao `0001` (KAM-003) que o §3.2 nao
# enumera: o dicionario escreve `tenant_channels(tenant_id, phone_number_id,
# waba_id, vertical, estado, …)` com reticencias, e `platform.tenants(id uuid)`
# so com a chave. Vem do DDL de `docs/tecnica/03` §5.2 (`tenants`) e de
# `docs/tecnica/01` §7.1 (`tenant_channels`), e estao no inventario fechado de
# `db/tests/test_inventario.py`.
#
# O `tenant_channels.token_ref` saiu desta lista com a emenda 1.22 (KAM-019): o
# `token_ref` passou a ser nome do §3.15, como coluna de `handoff_accounts`, e o
# lint recusa uma extensao que o dicionario ja cobre. Nao e perda de rigor — a
# extensao e qualificada e o nome canonico nao, mas ambos descrevem a mesma
# coisa (uma `SecretRef` opaca), e era isso que a extensao estava a dizer.
#
# O `tenant_channels.waac_id` saiu **pela mesma razao**, com a emenda 1.29
# (KAM-016): o `waac_id` passou a ser nome do §3.20, como coluna de
# `channel_onboarding`, porque o criterio 8 desse ticket manda guardar os dois
# identificadores (`waba_id` hoje, `waac_id` na Fase 3 do novo modelo de contas,
# H1 2028). O lint recusou a extensao na primeira execucao do *gate* 3b, com a
# mensagem que a entrada do `token_ref` ja tinha produzido uma vez — e a
# repeticao e o sinal de que a regra funciona: um nome que um ticket poe no
# dicionario deixa de precisar de extensao, e a extensao que fica vira
# duplicado.
#
# As do KAM-008 sao o que a revisao `0003` (identidade de contacto) usa e o
# §3.1 nao enumera: duas colunas de `contact_endpoints` — o dicionario escreve a
# tabela com reticencias — e os valores dos tres dominios fechados. Eram tres:
# o `expira_at` saiu com a emenda 1.11 (KAM-007), que o pos no dicionario como
# campo de payload, e uma extensao de um nome que o dicionario tem e redundante. Os valores
# ficam aqui, **qualificados**, e nao no dicionario: um `telefone` ou um `bsuid`
# na coluna do nome canonico passava a ser aceite em qualquer posicao, incluindo
# como nome de coluna. `finalidade` e `recolhido_at` vem de `docs/tecnica/03`
# §5.3, e os valores de `finalidade` sao os de la (*proposta*:
# os prazos e as finalidades estao por confirmar por parecer). As tabelas
# `contact_deks` e `hmac_key_versions`, as colunas `hmac_kid`, `erased_at`,
# `merged_into` e `merged_at` (linha «Estado de um contacto») e o papel
# `kamba_identity` entraram no dicionario (emenda 1.8, §3.1 e §3.2).

