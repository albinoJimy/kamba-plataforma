    licenca: MIT
    data_verificacao: "2026-10-08"
    fonte: "docs/tecnica/evidencia/E4_Stack_Licencas.md §1 e §2.8 (LICENSE)"
    estado_verificacao: CONFIRMADO
    estado: nao_adoptado
    ligacoes:
