    estado_verificacao: CONFIRMADO
    estado: nao_adoptado
    ligacoes:
      - "npm:meilisearch"
      - "pypi:meilisearch"
      - "imagem:meilisearch"
    ee: >-
      Os ficheiros «Enterprise Edition» em `enterprise_editions` sao BUSL-1.1 e
      a producao exige licenca comercial. A expressao e um `AND`: pela politica
      a pior manda, e o componente so entra com excepcao registada em ADR.

  - componente: langfuse
