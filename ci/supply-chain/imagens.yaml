# Inventario de imagens — KAM-067
#
# Toda a imagem que o repositorio referencia esta aqui, com o digest **lido da
# fonte** e a data em que se leu. `make supply-chain` falha se:
#
#   - uma referencia (compose, Dockerfile, workflow, `.env*`, ou uma constante
#     declarada abaixo) nao trouxer `@sha256:`;
#   - o digest de uma referencia nao for o de uma linha deste ficheiro;
#   - uma linha deste ficheiro nao for referenciada por nada (entrada morta).
#
# Como acrescentar ou actualizar uma imagem — sempre por esta ordem:
#
#   1. ler o digest da fonte, nunca de memoria nem de outro ficheiro:
#        docker buildx imagetools inspect <registo>/<nome>:<etiqueta>
#      (o digest do **indice** multi-arquitectura, que e o que serve as duas
#      arquitecturas que a equipa usa);
#   2. escreve-lo aqui, com `lido_em` e `lido_de`;
#   3. so depois nas referencias.
#
# Campos (`tools/supply_chain/imagens.py` recusa o ficheiro sem eles, e recusa
# qualquer chave que nao leia):
#
#   nome          repositorio, sem etiqueta. `node` e `docker.io/library/node`
#                 sao a mesma imagem.
#   etiqueta      a etiqueta a que o digest correspondia quando foi lido.
#   digest        `sha256:` + 64 hexadecimais.
#   lido_em       data ISO da leitura. Nao pode ser futura.
#   lido_de       o comando ou o endereco de onde se leu.
#   componentes   os componentes de `licencas.yaml` que a imagem traz. Cada um
#                 tem de ter linha la.
#   cosign        um de:
#                   verificar   ha assinatura publicada; o gate corre
#                               `cosign verify` contra o digest. Exige
#                               `cosign_identidade` e `cosign_emissor`.
#                   n/a         **apurou-se** que nao ha assinatura publicada.
#                               Exige `cosign_razao` com a compensacao.
#                   por_apurar  ninguem verificou se ha. Nao e um estado final:
#                               o gate conta-as em voz alta em cada execucao.
#   cosign_razao  obrigatoria para `n/a` e `por_apurar` (>= 40 caracteres).
#
# SOBRE O ESTADO `por_apurar` DAS QUATRO LINHAS ABAIXO. O criterio 2 do KAM-067
# admite dois estados: verificar onde ha assinatura, `n/a` onde nao ha. Escrever
# `n/a` afirmava que **nao existe** assinatura publicada para estas imagens, e
# isso ninguem verificou: nao ha `cosign` nesta maquina nem no runner, e nao se
# descarrega um binario de terceiros para o descobrir a meio de um ticket. O
# estado honesto e o terceiro. A compensacao que o criterio pede — digest, SBOM
# e varrimento — esta hoje feita **a um terco**: o digest esta fixado; o SBOM
# por imagem e o varrimento das camadas dependem de um pipeline que construa e
# publique imagens, que e o KAM-078.
#
# O que se apurou sem instalar nada: a 2026-10-12, a etiqueta
# `sha256-<digest>.sig` (onde o cosign guarda assinaturas no esquema antigo) da
# `not found` no Docker Hub para as quatro. E INDICIO de ausencia, nao prova —
# nao cobre a API de referrers nem assinaturas por plataforma —, e por isso nao
# chega para `n/a`.
#
# O LiteLLM, quando entrar (KAM-030), **nao pode** vir com `n/a` nem com
# `por_apurar`: a assinatura esta publicada desde a v1.83.0 (E4 §2.7,
# CONFIRMADO), e essa exigencia esta no codigo, nao neste ficheiro.

