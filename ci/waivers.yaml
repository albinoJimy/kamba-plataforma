# Excepcoes aos gates de CI — KAM-002
#
# **Este e o unico mecanismo de excepcao do pipeline.** A regra transversal do
# §4 do Engineering Standards diz: "nenhum gate pode ser marcado skip sem ADR ou
# aprovacao registada". Dois tickets a jusante repetem a exigencia com palavras
# diferentes — o KAM-067 diz "excepcao registada em ADR" e o KAM-078 diz "exige
# referencia a ADR/aprovacao (lint do pipeline)" — e ambos consomem este
# esquema, em vez de inventarem o seu.
#
# Campos obrigatorios (`tools/ci_waivers.py` recusa o ficheiro sem eles):
#
#   gate               numero do gate
#   alvo               o que exactamente e dispensado. Nunca "tudo".
#                      Por gate:
#                        3   o ficheiro e o token (ver tambem ci/refs-allow.yaml)
#                        4   o ficheiro ou o estrato
#                        5-8 so `alvo: pipeline` dispensa um gate reservado; um
#                            alvo que nomeie outra coisa nao dispensa nada, e o
#                            validador di-lo. Antes comparava-se so o `gate`, e
#                            um waiver cujo alvo era um pacote npm dispensava o
#                            gate 5 inteiro.
#                        9   o ficheiro (ver tambem ci/secrets-allow.yaml)
#                        11  o `purl` do pacote (`pkg:npm/lodash@4.17.11`) para
#                            uma licenca, ou o identificador da vulnerabilidade
#                            (`GHSA-...`, `CVE-...`) para o varrimento da OSV.
#                            Uma licenca **proibida** so se dispensa com
#                            `adr_ou_aprovacao: ADR-NNN`: uma aprovacao datada
#                            nao chega (KAM-067; docs/supply-chain.md §6.4)
#   adr_ou_aprovacao   `ADR-NNN` que o fundamenta, ou `aprovacao:<quem>@<data>`
#                      para uma decisao humana registada. **A data e lida**
#                      desde o KAM-135: tem de ser uma data a serio e nao pode
#                      ser futura. Um `@9999-99-99` passava, e com ele a
#                      exigencia de «aprovacao registada» do specs/01 §4 ficava
#                      satisfeita sem registar nada
#   autor              quem o escreveu, e a quem se pergunta
#   razao              porque e aceitavel, numa frase que sobreviva a sair o autor
#   criado_em          data ISO em que o waiver nasceu. Obrigatoria desde o
#                      KAM-135, e e dela que o prazo se conta
#
# A chave `regra` SAIU, e com ela a leitura errada mais perigosa das sete que o
# KAM-134 fechou. Uma versao anterior deste cabecalho documentava-a
# (`gate: 11, regra: licenca`) e o exemplo abaixo escrevia-a; nenhum codigo a
# lia. Quem escrevesse `regra: licenca` acreditava ter dispensado so a licenca,
# e tinha dispensado tambem a vulnerabilidade.
#
# O que vale, dito por extenso: **um waiver de gate 11 dispensa o alvo para
# QUALQUER veredicto** — licenca, vulnerabilidade, SBOM. Se for preciso
# dispensar um e nao o outro, isso nao existe hoje, e pedir um `regra` que
# funcione e trabalho de quem o precisar.
#
# Desde o KAM-134, uma chave que este ficheiro nao conheca **falha com codigo
# 2** (erro de configuracao). E por isso que a `regra` saiu tambem do exemplo
# comentado: descomenta-lo como modelo passaria a dar erro.
#   expira_em          data ISO, no maximo 30 dias **apos o `criado_em`**. Um
#                      waiver expirado **falha o pipeline** — nao se ignora nem
#                      avisa
#
# Um waiver sem referencia, sem data, ou expirado, faz o `make ci-waivers`
# falhar. Isso e deliberado: a alternativa e uma excepcao que fica para sempre
# porque ninguem reparou que caducou.
#
# **RENOVAR NAO E EMPURRAR UMA DATA** (KAM-135). Ate aqui o prazo contava-se de
# **hoje**, e nao da criacao: bastava mexer um digito no `expira_em` para a
# excepcao durar mais trinta dias, e depois mais trinta, para sempre. Era o
# inverso exacto da propriedade que este ficheiro existe para entregar.
#
# Agora prolongar exige mexer no `criado_em` — e um `criado_em` novo sem
# `adr_ou_aprovacao` e `autor` novos nao e uma renovacao, e um disfarce. A
# diferenca le-se no diff, que e onde tem de se ler.
#
# E os gates que aceitam waiver deixaram de poder divergir do canon em
# silencio: os dezoito do specs/01 §4 estao todos classificados em
# `tools/ci_waivers.py`, ou como «aceita» ou como «nao aceita, e eis porque».
# Entraram o **14** (imagem, KAM-067) e o **18** (release sem SBOM, KAM-078),
# que o docs/ci.md §5 diz consumirem este esquema e que o validador recusava.

version: 1

# Nenhuma excepcao activa. O ficheiro existe vazio de proposito: o esquema e o
# contrato, e os gates sao aplicados sem excepcoes no estado inicial.
#
# O exemplo abaixo esta comentado para mostrar a forma, e nao conta como
# excepcao. `tools/ci_waivers.py` tem fixtures que validam cada campo.
#
# waivers:
#   - gate: 11
#     alvo: "pkg:npm/exemplo@1.0.0"
#     adr_ou_aprovacao: ADR-014
#     autor: nome.sobrenome
#     razao: >-
#       A licenca e AGPL-3.0, mas o componente corre como servico separado e nao
#       e distribuido, o que o ADR-014 cobre. Rever quando a D6 fechar.
#     criado_em: 2026-10-11
#     expira_em: 2026-11-10

waivers: []
