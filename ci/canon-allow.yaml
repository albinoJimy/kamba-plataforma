# Variantes que ficam em `docs/tecnica/` — gate 3b, superficie `documentos` (KAM-111)
#
# O gate 3b falha se um documento de `docs/tecnica/` contiver um nome que o
# dicionario substitui (coluna «Substitui» do §3). Isto e a lista das
# ocorrencias que la ficam, e porque.
#
# Cada entrada e por FICHEIRO, VARIANTE e NUMERO EXACTO DE OCORRENCIAS:
#
#   * mais ocorrencias do que as declaradas -> falha (alguem repos a variante);
#   * menos -> falha (a excepcao ja nao corresponde ao documento; actualize-a);
#   * zero  -> falha (retire a excepcao).
#
# Duas classes, e a diferenca e a que importa:
#
# `historicas` — a variante e citada PARA DIZER QUE FOI SUBSTITUIDA: tabelas
#   «correccao ao doc 11», notas «corrige X». Sao as «notas explicitas
#   "substitui X" e tabelas de correccao historicas» que o criterio de aceitacao
#   do KAM-111 exclui da contagem. Nao tem prazo — e por isso tem `ancoras`:
#   excertos do documento que mostram que a variante esta a ser citada. Cada
#   linha onde ela aparece tem de conter pelo menos um. Sem ancora, trocar a
#   citacao por um uso vivo mantinha a contagem e passava.
#
# `dividas` — divergencia REAL: o documento usa a variante como se fosse o nome.
#   Nao constam das 12 que o KAM-111 enumera, e o ticket diz «as 12 e so essas»,
#   pelo que nao foram corrigidas nele. Tem `origem`, `criado_em` e `expira_em`
#   (maximo 30 dias, *proposta*, igual ao dos waivers). UMA DIVIDA VENCIDA FALHA
#   O GATE: a 2026-11-11 este ficheiro deixa `main` vermelho se as correccoes
#   nao tiverem sido feitas. E de proposito — a alternativa e uma lista de
#   dividas que ninguem revisita — e esta dito no bloco do KAM-111 do EPIC-01
#   (seccao de verificacao) e no ticket KAM-139, que as paga.
#   `criado_em` nao pode ser futuro: o prazo conta-se do dia do registo.

