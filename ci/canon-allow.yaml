# ESTA LISTA ESTA VAZIA, e e o criterio de aceitacao do KAM-139.
#
# Tinha treze entradas: as nove do KAM-111 (`kamba_ops`, `valor_max_pedido_kz`,
# `preco_kz`, `exato`, `total_kz`, `tenant_isolamento`) e as quatro que o
# KAM-007 acrescentou ao registar `expires_at` e `preco_modo` como variantes
# substituidas. Cinquenta e quatro ocorrencias em cinco documentos tecnicos.
#
# Foram pagas, documento a documento, e nao so trocadas: onde a troca mudava a
# **unidade** — `preco_kz` para `preco_minor`, `total_kz` para `total_minor` —
# os valores de exemplo foram multiplicados por cem e os tipos SQL passaram de
# `int` a `bigint`, porque trocar o nome e deixar o numero deixava os exemplos
# errados por um factor de cem. E os nomes **derivados** que o gate nao apanha,
# por nao estarem registados (`max_preco_kz`, `alvo_preco_kz`, `mediana_kz`,
# `gmv_pago_kz`, `receita_paga_kz`, `valor_min_review_kz`, `min_preco_kz`),
# seguiram a mesma regra: deixar um deles em Kz ao lado de uma coluna em
# centimos, na mesma seccao, era a contradicao que o ticket existe para fechar.
#
# Uma divida nova aqui e uma excepcao com prazo. A lista estar vazia quer dizer
# que nenhum documento tecnico usa hoje um nome que o dicionario substitui.
dividas: []
