# Areas permitidas para o gate 9 (scan de segredos) — KAM-002
#
# O gate 9 falha se encontrar um segredo. Este ficheiro diz onde um valor que
# *parece* segredo e legitimo — e so isso. Nao desliga o scanner: restringe-o.
#
# A regra do ticket, que vale a pena ler ao pe da letra: "um segredo-canario
# (formato de chave de API) numa fixture de teste falha o PR; o mesmo segredo
# fora das areas permitidas falha sempre". Ou seja: nem as fixtures sao area
# permitida por serem fixtures. O que se permite e muito mais estreito.
#
# As classes sao as que os padroes de `tools/scan_secrets/patterns.py`
# produzem, e nada mais. Hoje sao cinco:
#   chave_api           prefixo publicado pelo emissor (`ghp_`, `sk-ant-`)
#   chave_privada       bloco `-----BEGIN ... KEY-----`
#   credencial_em_url   utilizador:palavra-passe num URL
#   atribuicao          nome que significa segredo, com valor de entropia alta
#   digests             hashes e assinaturas (nunca sao achado; ver o scanner)
#
# Uma classe inventada e **recusada** com erro de configuracao. Nao e zelo: as
# tres primeiras areas deste ficheiro declaravam `placeholders` e `exemplos`,
# que nao sao classes de padrao nenhum, e por isso nao permitiam nada. O
# ficheiro dizia que a documentacao podia mostrar formas de chave, e o gate
# ficava vermelho no primeiro `.md` que o fizesse.

version: 1

# Cadeias que nunca contam como segredo, onde quer que aparecam. Sao
# placeholders e nao valores — e a comparacao e por **igualdade**, depois de se
# retirarem aspas e delimitadores.
#
# Antes era por contencao, e isso transformava cada entrada num interruptor:
# `sk-proj-...redacted` (prefixo publicado, 50 caracteres) era dispensado por
# acabar em `redacted`, e `unknown` dispensava qualquer valor que o contivesse.
# As classes `chave_api` e `chave_privada` nao consultam esta lista: o prefixo
# ja e prova.
placeholders_literais:
  - mude-me-localmente
  - verificacao-local-kam001
  - SEU-SEGREDO-AQUI
  - changeme
  - placeholder
  - unknown
  - example
  - exemplo
  - redacted
  - REDACTED
  - xxxxx

# Ficheiros onde valores com forma de segredo sao esperados, com a razao. Um
# caminho aqui **nao** desliga o scanner nesse ficheiro: so permite as classes
# listadas em `classes`.
areas:
  - caminho: .env.example
    classes:
      - atribuicao
    razao: >-
      E a razao de existir do ficheiro: mostrar a forma de cada variavel com
      placeholders. O DoD do KAM-001 exige que tenha so placeholders, e o gate
      9 e quem o verifica. Permite-se `atribuicao` e **nao** `chave_api` nem
      `chave_privada`: um placeholder atribuido a `POSTGRES_PASSWORD` e o que
      aqui se espera; uma chave com prefixo publicado nao, e essa continua a
      falhar aqui como em qualquer outro sitio.

  - caminho: docs/**/*.md
    classes:
      - atribuicao
    razao: >-
      A documentacao escreve atribuicoes a titulo de exemplo — `api_key = "..."`
      ao explicar o que o gate apanha. Os digests que ela tambem mostra
      (`sha256:`, `sha512.`) nao precisam de area: um digest nunca e achado, ver
      a nota em tools/scan_secrets/scanner.py. **Nao** se permite `chave_api`:
      uma chave com prefixo publicado num `.md` e uma fuga, escreva-se o que se
      escrever a volta dela. Para mostrar a forma de uma, usa-se o canario.

  - caminho: "tools/lint_refs/tests/fixtures/**"
    classes:
      - atribuicao
    razao: >-
      Fixtures do gate 3, que precisam de citar referencias invalidas de
      proposito. Nao ha segredos aqui, e a entrada existe para que uma linha de
      fixture com forma de atribuicao nao faca o gate 9 vermelho por causa do
      gate 3.

  - caminho: "libs/py-core/tests/test_secrets_*.py"
    classes:
      - atribuicao
    razao: >-
      Testes da porta `SecretProvider` (KAM-010). Um teste de um provedor de
      segredos atribui, por forca, valores a nomes que significam segredo — e
      o que la esta sao cadeias obviamente falsas
      (`token-de-teste-nao-e-um-segredo`). Permite-se `atribuicao` e **nao**
      `chave_api`: um valor com prefixo de emissor real continua a falhar aqui,
      e foi por isso que dois casos de teste perderam o `sk-` em vez de
      ganharem uma excepcao.

  - caminho: "packages/core-ts/tests/secrets.*.test.ts"
    classes:
      - atribuicao
    razao: >-
      O mesmo que a entrada acima, para a implementacao em TypeScript da mesma
      porta. As duas baterias sao espelho uma da outra e levam a mesma regra.

  - caminho: services/gwy/src/segredos.ts
    classes:
      - atribuicao
    razao: >-
      Os dois `id` de segredo que o GWY le (KAM-013), e **nada mais** — o
      ficheiro existe para que esta area seja tao estreita quanto possivel. Uma
      referencia ao `verify_token` tem, por forca, a forma que o gate apanha: o
      nome do campo e canonico (dicionario §3.9) e o valor e canonico, e nao ha
      maneira de escrever um ao lado do outro sem o scanner disparar. A
      alternativa era declarar `services/gwy/src/server.ts`, que e onde o cofre
      se le e o ultimo sitio do repositorio onde a classe `atribuicao` convem;
      assim esse ficheiro continua inteiramente varrido. Permite-se
      `atribuicao` e **nada** mais: uma chave com prefixo de emissor real
      continua a falhar aqui como em qualquer outro sitio. O que aqui esta sao
      nomes de referencia, publicados em `ops/secrets-inventory.yaml`; se um
      dia um valor a serio entrar neste ficheiro, o gate deixa de o apanhar, e
      e por isso que ele nao leva mais nada.

  - caminho: packages/core-ts/src/onboarding/segredos.ts
    classes:
      - atribuicao
    razao: >-
      Os tres `id` de segredo que o onboarding de canal le e escreve (KAM-016), e
      **nada mais** — o ficheiro existe para que esta area seja tao estreita
      quanto possivel, pelo mesmo desenho e pela mesma razao do
      `services/gwy/src/segredos.ts`. Um `id` do `ops/secrets-inventory.yaml`
      atribuido a um nome que contem «TOKEN» tem, por forca, a forma que o gate
      apanha: o nome e canonico (dicionario §3.9 e §3.20) e o valor e canonico, e
      a heuristica nao pode distinguir um `id` de um valor. Medido: o
      `"meta_client_token"` tem entropia de Shannon **3,293**, contra o minimo de
      3,2 do padrao. A alternativa era declarar
      `packages/core-ts/src/onboarding/contrato.ts`, que e onde vive o
      vocabulario inteiro do modulo e o ultimo sitio onde a classe `atribuicao`
      convem; assim esse ficheiro continua inteiramente varrido. Permite-se
      `atribuicao` e **nada** mais: uma chave com prefixo de emissor real
      continua a falhar aqui como em qualquer outro sitio. Se um dia um valor a
      serio entrar neste ficheiro, o gate deixa de o apanhar, e e por isso que
      ele nao leva mais nada — nem uma funcao, nem um tipo, nem um quarto nome.

  - caminho: "packages/core-ts/tests/onboarding*.test.ts"
    classes:
      - atribuicao
    razao: >-
      As baterias do Embedded Signup v4 (KAM-016), pela mesma razao da entrada
      `packages/core-ts/tests/secrets.*.test.ts`: um teste que prova que um
      *token* **nao** aparece na base, nos logs nem numa mensagem de erro tem,
      por forca, de ter um *token* em mao — e as cadeias obviamente falsas que
      ele usa (`EAAG-token-de-cliente-de-ensaio`,
      `EAAG-segredo-que-nao-deve-aparecer`) passam o minimo de entropia, como o
      proprio `token-de-teste-nao-e-um-segredo` do KAM-010 passa (3,320 contra
      3,2). **Isto nao dispensa fixtures por serem fixtures:** o curinga apanha
      os dois ficheiros deste ticket e nada mais na pasta, e permite-se
      `atribuicao` e **nao** `chave_api` — um valor com prefixo de emissor real
      continua a falhar aqui, e foi essa regra que fez os *tokens* de ensaio
      levarem `EAAG-` com um hifen e nao o prefixo real.
      O curinga e `onboarding*.test.ts` e **nao** `onboarding.*.test.ts`, que foi
      a primeira forma: o `fnmatch` do `tools/scan_secrets/scanner.py` exige um
      segmento entre os dois pontos, pelo que a segunda forma apanhava o
      `onboarding.graph.test.ts` e **nao** o `onboarding.test.ts`. O gate
      apanhou-o — tres achados que sobreviveram a declaracao —, e a entrada
      `packages/core-ts/tests/secrets.*.test.ts` nao tem o problema so porque os
      quatro ficheiros dela tem todos um segmento no meio.

  - caminho: packages/core-ts/tests_bd/onboarding.bd.test.ts
    classes:
      - atribuicao
    razao: >-
      O mesmo que a entrada acima, para a metade que corre contra um PostgreSQL
      real. E ela que faz o *dump grep* do criterio 3 do KAM-016 — junta
      `tenant_channels` e `channel_onboarding` em texto e exige que o *token*
      nao esteja la —, e para isso tem de saber qual e o *token*. Nomeia-se o
      ficheiro e nao a pasta: `tests_bd/` tem oito outras baterias, e nenhuma
      precisa disto.

  - caminho: "tools/scan_secrets/tests/fixtures/canario/**"
    classes:
      - chave_api
      - chave_privada
      - credencial_em_url
      - atribuicao
    razao: >-
      **A unica area onde um segredo com forma real e permitido**, e so porque e
      o canario que prova que o scanner funciona. O teste copia estes ficheiros
      para fora da pasta e exige que sejam detectados. Se esta entrada
      desaparecer, o proprio canario faz o gate 9 ficar vermelho — e e isso que
      se quer. As classes sao nomeadas uma a uma, e nao por curinga, para que
      acrescentar um padrao novo ao scanner nao fique automaticamente dispensado
      aqui.
