# Blocos dispensados do `tools/lint_bloco` — KAM-183.
#
# **Isto e divida, nao conformidade.** E a mesma leitura que o
# `ci/backlog-allow.yaml` escreve para si proprio: uma dispensa declarada e um
# defeito que alguem reconheceu e deixou para depois, com o nome de quem o
# reclama. Nao e uma excepcao a regra.
#
# ## PORQUE E QUE ESTAS SETE EXISTEM
#
# O *lint* nasce depois dos blocos. Medido sobre a `publico/main` em `74ddc23`:
# **30 divergencias em 8 blocos**, de **79** emparelhados. Em **todas**, a caixa
# esta por marcar e a tabela de verificacao daquele ticket diz `satisfeito` ou
# `marcada` — a mesma forma exacta do escape que deu origem a este ticket.
#
# **Os numeros subiram de 29/7/53 depois da revisao adversarial**, e nao porque
# a arvore mudasse: o *parser* passou a reconhecer o cabecalho `| CA | Estado |
# Evidência |`, que **26** tabelas usam e que ele descartava. A cobertura passou
# de 53 para 79 blocos emparelhados, e com ela apareceu o oitavo bloco.
#
# ## PORQUE E QUE NAO SE CORRIGEM AQUI
#
# Porque **a caixa segue a tabela, e a tabela e a evidencia daquele ticket e nao
# deste**. Marcar as 29 caixas seria este ticket a decidir, por sete outros, que
# a coluna de Estado deles esta certa — e a convencao que o manda fazer (o
# KAM-080 e o KAM-082) nao esta ratificada: e o que o §5 do
# `../docs/lint-bloco.md` devolve ao fundador, com a medicao das **52**
# primeiras-palavras distintas que a coluna de Estado usa na arvore.
#
# Corrigir sem essa decisao seria propagar uma convencao por 29 caixas de sete
# tickets alheios a pretexto de um *lint* novo.
#
# ## O QUE ACONTECE QUANDO UM BLOCO SAI DAQUI
#
# A dispensa e por **bloco** e nao por linha, de proposito: quem emendar um
# destes blocos tira a linha daqui e o *lint* passa a cobri-lo por inteiro, sem
# ficar a meio. Uma dispensa por linha convidava a emendar metade.
#
# E nenhuma leva prazo, ao contrario das do `backlog-allow.yaml`. Nao e
# esquecimento: um prazo que ninguem pode cumprir sem a decisao do §5 e um prazo
# que vence e se renova, e isso ensina a ignorar prazos. O gatilho e a decisao,
# e esta nomeada.

