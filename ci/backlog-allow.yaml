# ---------------------------------------------------------------------------
# Cabecalhos de versao atrasados: **nenhum declarado**
# ---------------------------------------------------------------------------
#
# Medido a 2026-10-18: **24** cabecalhos atrasados em 41 documentos com tabela
# (16 dos 41 nao tem campo de versao nenhum, e para esses so vale a verificacao
# da sequencia — a ausencia do campo nao e defeito e o gate nao a inventa).
#
# Eram duas familias, e as duas tinham a mesma causa:
#
#   - os **onze epics**, o `specs/01` e os **onze** documentos de
#     `docs/tecnica/`, que nasceram com `| Versao | 1.0 |` numa tabela de campos
#     e nunca mais tiveram o campo tocado, enquanto o historico foi crescendo;
#   - o `specs/INDICE.md`, que usa a outra forma (`**Versao do conjunto:**`) e
#     estava em 1.2 com historico muito a frente.
#
# **Pagas todas.** Das 24 medidas, cinco sairam antes, e cada uma com o ticket
# que a pagou de passagem - lido do historico deste ficheiro, nao de memoria:
# o `specs/EPIC-02` com o KAM-023 (PR #39), o `specs/EPIC-03` com o KAM-025
# (PR #52), o `docs/tecnica/02` com o KAM-031 (PR #69), e o `specs/EPIC-01` e
# o `specs/INDICE.md` com o KAM-163 (PR #76). Restavam 19, e **o KAM-167
# pagou-as a 2026-10-28**, as 19 no mesmo PR e nenhuma de passagem: e o
# primeiro ticket cujo objecto sao elas.
#
# Em cada uma, o campo do cabecalho passou a dizer o valor que a
# ultima linha do proprio «Controlo de versoes» ja dizia, lido do documento:
# o `specs/01` em 1.3, o EPIC-04 em 1.1, o EPIC-05 em 1.2, o EPIC-06 em 1.2, o
# EPIC-07 em 1.7, o EPIC-08 em 1.2, o EPIC-09 em 1.1, o EPIC-10 em 1.4, o
# EPIC-11 em 1.3, e em `docs/tecnica/` o 00 em 1.3, o 01 em 1.5, o 03 em 1.3,
# o 04 em 1.4, o 05 em 1.4, o 06 em 1.6, o 07 em 1.3, o 08 em 1.4, o 09 em 1.3
# e o 10 em 1.7.
#
# **Nenhum dos 19 ganhou linha de «Controlo de versoes» por causa disto**, e a
# razao esta escrita no bloco do KAM-167: o campo e metadado sobre a versao do
# documento, nao conteudo dele, e por-lo a dizer o que o historico ja registra
# nao e uma emenda nova. Dezanove linhas novas seriam dezanove numeros tomados
# em paralelo com quem esta a escrever ao mesmo tempo - que e precisamente a
# contencao de onde nasceu o buraco do 1.13 - e cada uma registraria «nenhuma
# alteracao propria». E o precedente da casa: o KAM-163 pagou o cabecalho do
# `specs/EPIC-01` da mesma maneira.
#
# O KAM-138 declarava a correccao fora de ambito: este gate media-a, e a divida
# estava registada nas linhas 4 e 21 de `docs/dividas-documentais.md`. A 21
# fechou com o KAM-165 e a 4 com o KAM-167. Quem voltar a declarar um
# cabecalho aqui apaga a sua linha no mesmo PR em que o corrigir — se nao o
# fizer, o gate falha com codigo 2 por declaracao que ja nao casa nada.

