# NOTA SOBRE O R11, porque o DoD do KAM-138 manda remeter para ele e a medicao
# nao lhe da razao. O risco R11 do `specs/EPIC-01_Fundacoes_Dados.md` diz que
# «KAM-012 e KAM-010 sao P1 mas bloqueiam/servem tickets P0». Hoje os dois sao
