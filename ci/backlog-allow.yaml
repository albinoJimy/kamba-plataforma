# Declaracoes do lint_backlog (gate 3c) — KAM-138
#
# Tres listas, e as tres existem pela mesma razao: duas das verificacoes deste
# gate nascem com o conjunto **sujo**, e a alternativa a declarar o estado
# conhecido era nao as verificar de todo.
#
#   inversoes    Um ticket que depende de outro de prioridade mais baixa, ou de
#                fase mais tardia. O estado inicial nao e limpo e a escolha esta
#                escrita: cada inversao conhecida fica aqui com razao e dono, e
#                passa a AVISO; uma inversao que nao esteja aqui FALHA desde o
#                primeiro dia.
#
#   sequencias   Um numero saltado no «Controlo de versoes» de um documento.
#                Nasce de dois ramos tomarem o mesmo numero em paralelo, e a
#                emenda ficar sem linha.
#
#   cabecalhos   Um documento cujo campo de versao no cabecalho esta atras da
#                ultima linha do seu «Controlo de versoes».
#
# **Uma declaracao que deixe de casar alguma coisa FALHA o gate (codigo 2).** E
# a regra dos irmaos (`lint_refs`, `lint_contagens`) e e o que torna estas
# listas auto-limpantes: corrigir um cabecalho obriga a apagar a sua linha
# daqui, no mesmo PR. Quando as listas esvaziarem, as duas verificacoes passam
# a falha sem ninguem mexer no codigo.
#
# **Toda a entrada tem prazo**, como as `dividas` do `ci/contagens-allow.yaml`:
# `criado_em`, `expira_em`, e no maximo **31 dias** entre os dois, contados da
# criacao. Passada a data, a dispensa volta a ser achado e o gate falha.
#
# A primeira versao deste ficheiro **nao tinha prazo**, e dizia por escrito que
# a ausencia era deliberada. Estava errada, e a revisao adversarial do KAM-138
# mostrou porque: das 25 entradas com campo de versao, 24 ficavam dispensadas e
# a unica que passava tem **uma** linha de historico — a verificacao do
# cabecalho nao validava um unico documento com emendas, e sem data nunca
# viria a validar. «Passa a falha quando a lista esvaziar» so e um compromisso
# se houver um dia em que a lista tem de estar vazia.
#
# **O `criado_em` nao pode estar no futuro.** Sem isso o tecto de 31 dias e
# relativo a uma ancora que ninguem ancora, e `criado_em` daqui a um ano da
# uma dispensa activa por tempo arbitrario. E a regra do `tools/ci_waivers.py`
# desde o KAM-135, e a razao dele serve aqui: «nao se cria no futuro — e a
# forma mais simples de esticar o prazo sem parecer que se esticou».
#
# **As datas estao escalonadas de proposito.** Se vencessem todas no mesmo dia,
# o gate ficava vermelho com 26 achados de uma vez e a saida pratica era
# renovar as 26 num so commit — o carimbo automatico que o prazo existe para
# impedir. Escalonadas, sao uma fila: cada grupo chega a sua vez, e renovar um
# grupo e uma decisao pequena que se le no diff.
#
# **O que esta aqui continua a ser trabalho de outro ticket.** Sao residuos de
# renumeracao registados em `docs/dividas-documentais.md` (linhas 4 e 21), cuja
# correccao o KAM-138 declara fora de ambito: aqui so se passa a medi-los. O
# prazo nao lhes atribui dono — **nenhum ticket os reclama hoje**, e e isso que
# o KAM-138 devolve no PR. O que o prazo faz e obrigar a pergunta a ser feita
# numa data em vez de nunca.
#
# **Duas foram reclamadas.** O KAM-165 pagou o buraco do `1.13` e a inversao de
# prioridade, no dia em que as duas venciam, e as duas declaracoes sairam
# daqui: uma declaracao que ja nao casa nada falha o gate com codigo 2. Ficam
# as 19 de cabecalho - uma a vencer a 2026-11-04, oito a 2026-11-11 e dez a
# 2026-11-18.
version: 1

# ---------------------------------------------------------------------------
# Inversoes de prioridade e de fase: **nenhuma declarada**
# ---------------------------------------------------------------------------
#
# Medido a 2026-10-18 sobre `publico/main`, com `python -m lint_backlog check`:
# **1** inversao de prioridade e **0** de fase, em 159 blocos. Era a
# KAM-158 (P1) -> KAM-130 (P2), e **o KAM-165 pagou-a a 2026-10-28**, no dia em
# que a dispensa vencia: o KAM-130 passou a P1 nas tres superficies. A pergunta
# que o KAM-138 devolveu - rever a prioridade de um ticket de outro autor e
# decisao de produto - foi respondida pelo fundador, e a resposta esta na linha
# 1.44 do `specs/EPIC-01_Fundacoes_Dados.md`.
#
# A lista fica **vazia, e por isso ausente**: uma inversao que nao esteja
# declarada falha desde o primeiro dia, que e o estado a que se queria chegar.
#
# NOTA SOBRE O R11, porque o DoD do KAM-138 manda remeter para ele e a medicao
# nao lhe da razao. O risco R11 do `specs/EPIC-01_Fundacoes_Dados.md` diz que
# «KAM-012 e KAM-010 sao P1 mas bloqueiam/servem tickets P0». Hoje os dois sao
# **P0** no §4 e nos seus blocos: o R11 descreve um estado que ja nao existe. A
# linha do risco nao se altera aqui - reescrever o registo de riscos de um epic
# a partir de uma medicao de passagem e precisamente o gesto que este gate
# existe para tornar desnecessario -, e a divergencia fica dita no PR do
# KAM-138 e devolvida a quem mantem o epic.

