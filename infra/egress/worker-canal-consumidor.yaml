# Lista de saidas de `worker-canal-consumidor` — KAM-067 criterio 9; servico do KAM-187.
#
# Negado por omissao: o que nao esta em `destinos` nao sai.
#
# E um dos servicos do `worker-canal` (uma imagem, um `command:` cada). O
# `supply_chain` pede uma lista por **servico de compose** cujo nome nao e o de
# uma pasta de `services/`, e por isso o `services/worker-canal/egress.yaml` nao
# o cobre.
#
# Ate ao KAM-227 a lista era vazia. Desde ele o servico corre o consumidor
# `outbound` (`KAMBA_CONSUMER: outbound` nos tres compose), que envia a resposta
# do AGR pelo `Saida` do KAM-015 — e o `Saida` fala com a Graph API. Sai pelo
# `proxy-saida` (`*saida` no compose), como o `gwy`.
version: 1
servico: worker-canal-consumidor
por_omissao: negar
destinos:
  - fqdn: graph.facebook.com
    porta: 443
    protocolo: https
    razao: >-
      Graph API da Meta, para o envio das respostas do AGR ao WhatsApp
      (`POST /<versao>/<phone_number_id>/messages`, `outbound/cliente.ts`),
      com o *token* do canal lido pelo `token_ref` (KAM-227). O ADR-001 faz do
      GWY o unico endpoint de *webhook* da Meta, que e a entrada; a saida e do
      Outbound, que o KAM-224 pos neste consumidor. Destino de transferencia
      internacional ja reconhecido (ADR-008), o mesmo do `gwy`.
    ticket: KAM-227
