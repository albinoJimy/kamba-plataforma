# Lista de saidas de `worker-canal-entrada` — KAM-067 criterio 9; servico do KAM-187.
#
# Negado por omissao: o que nao esta em `destinos` nao sai.
#
# E um dos servicos do `worker-canal` (uma imagem, um `command:` cada). O
# `supply_chain` pede uma lista por **servico de compose** cujo nome nao e o de
# uma pasta de `services/`, e por isso o `services/worker-canal/egress.yaml` nao
# o cobre.
#
# Ate ao KAM-231 a lista era vazia. Desde ele o processo corre o MED do KAM-020
# para a foto do dono (decisao do fundador de 2026-11-21, P4 A), e o MED fala
# com a Graph API para resolver o `media_id`. Sai pelo `proxy-saida` (`*saida`
# no compose), como o `worker-canal-consumidor`.
#
# Os bytes da foto vem de um URL que a Graph devolve, num anfitriao da CDN da
# Meta: `lookaside.fbsbx.com`, **NAO VERIFICADO** — nao ha evidencia da API de
# media da Meta (`packages/core-ts/src/med/contrato.ts`). Decisao do fundador de
# 2026-11-22 (KAM-231, opcao A): entra aqui, na allowlist do
# `infra/egress/proxy-saida.yaml` e na configuracao gerada do Envoy, e o codigo
# confere o anfitriao contra uma lista fechada (`ANFITRIOES_DA_DESCARGA`): so
# HTTPS, porta por omissao e sem credenciais no URL. Recusado: nao o abrir.
version: 1
servico: worker-canal-entrada
por_omissao: negar
destinos:
  - fqdn: graph.facebook.com
    porta: 443
    protocolo: https
    razao: >-
      Graph API da Meta, para o MED resolver o `media_id` da foto do dono num
      URL temporario (`GET /<versao>/<media_id>`, `med/graph.ts`), com o
      *token* do canal da conversa lido pelo `token_ref` (KAM-231). O mesmo
      FQDN e o mesmo *token* do envio do `worker-canal-consumidor` (KAM-227);
      destino de transferencia internacional ja reconhecido (ADR-008).
    ticket: KAM-231

  - fqdn: lookaside.fbsbx.com
    porta: 443
    protocolo: https
    razao: >-
      NAO VERIFICADO. O anfitriao do URL temporario que a Graph devolve para a
      media do WhatsApp, de onde o MED descarrega a foto do dono com o mesmo
      *token* (`med/graph.ts`, `ANFITRIOES_DA_DESCARGA`). Decisao do fundador
      de 2026-11-22 (KAM-231, opcao A).
    ticket: KAM-231
