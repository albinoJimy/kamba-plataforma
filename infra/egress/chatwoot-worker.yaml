# Lista de saidas de `chatwoot-worker` — KAM-067, criterio 9.
#
# Negado por omissao: o que nao esta em `destinos` nao sai. Este ficheiro e o
# contrato; **a aplicacao na rede e do KAM-076** (proxy de saida com allowlist
# de FQDN). `make supply-chain` falha se o ficheiro faltar, se `por_omissao`
# deixar de ser `negar`, ou se um destino nao tiver nome (`*`, IP, CIDR).
#
# Os trabalhos assincronos do painel (Sidekiq). Mesma razao do `chatwoot`, e
# **e aqui que ela morde**: as filas deste processo sao as do correio e das
# notificacoes, que e o caminho por onde conteudo de conversa de um cliente
# final sairia sem ninguem decidir. Nenhuma credencial de SMTP esta
# configurada, e a lista vazia e a segunda fechadura.
#
# Cada destino: `fqdn`, `porta`, `protocolo`, `razao` e `ticket` (KAM-NNN).
# Ligacoes a outros servicos da pilha (base de dados, fila) nao sao saidas: sao
# redes do compose.

version: 1
servico: chatwoot-worker
por_omissao: negar
destinos: []
