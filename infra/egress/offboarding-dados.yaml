# Lista de saidas de `offboarding-dados` — KAM-067 criterio 9; servico do KAM-218.
#
# Negado por omissao: o que nao esta em `destinos` nao sai.
#
# O `offboarding-dados` corre `python -m kamba_core.offboarding` com a imagem do
# AGR, e o nome do servico nao e o de uma pasta de `services/`: o
# `services/agr/egress.yaml` nao o cobre, e o `supply_chain` pede esta lista.
# **Vazia**: o processo fala com a base e com o armazenamento, os dois em `data`
# (`internal: true`), e o servico nao tem `HTTPS_PROXY`. A entrega do
# certificado ao titular nao sai daqui enquanto nao houver agregador de SMS nem
# fornecedor de e-mail escolhidos (KAM-116 e KAM-115); quando houver, o destino
# entra nesta lista e na do `proxy-saida`.
version: 1
servico: offboarding-dados
por_omissao: negar
destinos: []
