# Arquivo contínuo de WAL — KAM-079
#
# Fragmento de `postgresql.conf` que liga o arquivo de WAL ao pgBackRest.
# Fonte: `docs/tecnica/09_Topologia_Operacao_Escala.md` §8.1, linha «WAL».
#
# ============================================================================
# O COMPOSE DE PRODUCAO NAO MONTA ESTE FICHEIRO, E E A LINHA MAIS IMPORTANTE
# DESTA PASTA
# ============================================================================
#
# `archive_mode = on` com um `archive_command` que falha nao e um backup
# incompleto: e uma **falha de disponibilidade**. O Postgres nao recicla um
# segmento de WAL ate o `archive_command` devolver 0. Com o `repo1` inalcancavel
# — e nao ha `repo1`, porque a D1/KAM-105 nao decidiu o destino — o `pg_wal`
# cresce a cada 60 s do `archive_timeout` ate o disco encher, e um cluster com o
# disco cheio deixa de aceitar escritas.
#
# Um ticket de backups que derrubasse a base de dados para parecer entregue
# seria o pior resultado possivel. Por isso este ficheiro esta em git, com o
# `lint` a verificar os seus numeros contra o `cobertura.yaml`, e **nao esta
# montado**. Ligar os dois e uma linha de `volumes:` no
# `infra/compose/docker-compose.prod.yml` mais um `command:` que aponte o
# `include`, e faz-se **depois** de haver destino — nao antes.
#
# O que isto custa, dito sem rodeio: o criterio 1 do bloco pede «`pgbackrest
# check` e `pgbackrest info` verdes», e nenhum dos dois correu nem pode correr.
# A caixa fica vazia com o credor nomeado.

# ---------------------------------------------------------------- o arquivo
#
# `archive_mode = on` e nao `always`: `always` arquiva tambem numa replica em
# recuperacao, e nao ha replica (a replica de espera e o P1 do §8.2, para BD
# acima de 40 GB).
archive_mode = on

# O `archive_timeout` do criterio: 60 s. E o tecto do RPO antes do envio — o
# §8.2 escreve «tipico <= 2 min (`archive_timeout` 60 s + envio)» contra um RPO
# alvo de 5 min. Baixa-lo produz mais segmentos quase vazios (cada mudanca
# forcada escreve um segmento inteiro de 16 MB); subi-lo come o RPO.
archive_timeout = 60s

# O `archive_command` delega no pgBackRest, e **sem bandeira de modo**. A
# revisao adversarial mediu aqui o defeito mais caro deste ficheiro: a primeira
# versao escrevia `archive-push --async %p`, e **`--async` nao e uma opcao do
# pgBackRest** — a opcao chama-se `archive-async` e o pgBackRest nao aceita
# abreviaturas. Cada invocacao falharia com erro de opcao invalida, o
# `archive_command` nunca devolveria 0, e o arquivo **nunca funcionaria** — que
# e exactamente o modo de falha que este ficheiro existe para evitar, e que
# chegaria como «o disco do Postgres encheu».
#
# O modo assincrono liga-se no `pgbackrest.conf` (`archive-async=y`) e nao na
# linha de comando: **nao ha bandeira para por aqui.** O comando devolve depois
# de entregar o segmento a fila local, e o processo assincrono empurra-o.
#
# **O `%p` nao se cita por acidente:** o caminho vem do Postgres e nao do
# ambiente, e e relativo ao `PGDATA`.
#
# Esta linha passou a ter regra de *lint* (`arquivo-sem-pgbackrest`,
# `arquivo-com-opcao-inexistente`, `arquivo-sem-stanza`), porque a versao
# errada atravessou as cinco superficies sem que nenhuma olhasse para ela: o
# `backup_lint` confrontava o `archive_mode` e o `archive_timeout` e **nao lia
# a unica linha que invoca o pgBackRest**.
archive_command = 'pgbackrest --stanza=kamba archive-push %p'

# ------------------------------------------------------------------- o WAL
#
# `wal_level = replica` e o minimo que o arquivo exige. Nao se poe `logical`:
# `logical` e para replicacao logica, que este ticket nao traz, e custa volume
# de WAL — mais volume de WAL com um destino inalcancavel e o disco a encher
# mais depressa.
wal_level = replica

# **Isto nao governa o arquivo.** A primeira versao comentava esta linha como
# «quantos processos empurram WAL em paralelo» e escrevia «Dois» ao lado de um
# `3` — duas coisas erradas numa linha. O `max_wal_senders` conta processos de
# **replicacao por streaming**; quem empurra WAL para o repositorio e o
# `archive_command`, um segmento de cada vez, e o paralelismo desse caminho e o
# `process-max` do pgBackRest.
#
# Fica em 3 porque `wal_level = replica` sem walsenders deixa o cluster sem
# forma de servir um standby nem um `pg_basebackup`, e 3 e um standby mais
# folga para uma copia base a correr ao mesmo tempo. Nao e um numero medido:
# nao ha standby nem producao onde o medir.
#
# **O que falta, dito e nao contornado:** o `process-max` **nao esta escrito**
# no `pgbackrest.conf`, logo fica na omissao de **1** — um processo a comprimir,
# cifrar e transferir. E ele, e nao esta linha, que governa o debito de arquivo
# e de **restauro**, que e o orcamento de RTO do `docs/tecnica/09` §8.2 (o
# criterio 4). Nao se escreveu um valor porque escolhe-lo exige medir o
# restauro contra o destino real, e nao ha `repo1` — poe-lo a 2 «porque o
# compose da `cpus: 2.0`» era repetir, noutra chave, o erro que esta linha
# acabou de pagar. Credores: **D1 (KAM-105)** pelo destino e **KAM-085** pelo
# simulacro cronometrado que o mede.
max_wal_senders = 3
wal_compression = on

# ------------------------------------------------------------ a recuperacao
#
# `restore_command` nao vai aqui: pertence ao *host* de restauro e nao ao de
# producao. Escreve-lo no `postgresql.conf` de producao nao faz nada em
# funcionamento normal e e um pe-de-cabra se alguem arrancar o cluster com um
# `recovery.signal` por engano. O restauro compoe-no por `pgbackrest restore`,
# que escreve a configuracao de recuperacao ele proprio.
#
# O **PITR de 7 dias** nao e uma chave deste ficheiro: vive na retencao de
# arquivo do `pgbackrest.conf` (`repo1-retention-archive=7`). Fica dito aqui
# porque este e o ficheiro onde um leitor vai procurar os «7 dias» e nao os vai
# encontrar.
