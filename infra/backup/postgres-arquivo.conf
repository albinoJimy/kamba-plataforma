# Arquivo contínuo de WAL — KAM-079
#
# Fragmento de `postgresql.conf` que liga o arquivo de WAL ao pgBackRest.
# Fonte: `docs/tecnica/09_Topologia_Operacao_Escala.md` §8.1, linha «WAL».
#
# ============================================================================
# O COMPOSE DE PRODUCAO NAO MONTA ESTE FICHEIRO, E E A LINHA MAIS IMPORTANTE
# DESTA PASTA
# ============================================================================
#
# `archive_mode = on` com um `archive_command` que falha nao e um backup
# incompleto: e uma **falha de disponibilidade**. O Postgres nao recicla um
# segmento de WAL ate o `archive_command` devolver 0. Com o `repo1` inalcancavel
# — e nao ha `repo1`, porque a D1/KAM-105 nao decidiu o destino — o `pg_wal`
# cresce a cada 60 s do `archive_timeout` ate o disco encher, e um cluster com o
# disco cheio deixa de aceitar escritas.
#
# Um ticket de backups que derrubasse a base de dados para parecer entregue
# seria o pior resultado possivel. Por isso este ficheiro esta em git, com o
# `lint` a verificar os seus numeros contra o `cobertura.yaml`, e **nao esta
# montado**. Ligar os dois e uma linha de `volumes:` no
# `infra/compose/docker-compose.prod.yml` mais um `command:` que aponte o
# `include`, e faz-se **depois** de haver destino — nao antes.
#
# O que isto custa, dito sem rodeio: o criterio 1 do bloco pede «`pgbackrest
# check` e `pgbackrest info` verdes», e nenhum dos dois correu nem pode correr.
# A caixa fica vazia com o credor nomeado.

# ---------------------------------------------------------------- o arquivo
#
# `archive_mode = on` e nao `always`: `always` arquiva tambem numa replica em
# recuperacao, e nao ha replica (a replica de espera e o P1 do §8.2, para BD
# acima de 40 GB).
archive_mode = on

# O `archive_timeout` do criterio: 60 s. E o tecto do RPO antes do envio — o
# §8.2 escreve «tipico <= 2 min (`archive_timeout` 60 s + envio)» contra um RPO
# alvo de 5 min. Baixa-lo produz mais segmentos quase vazios (cada mudanca
# forcada escreve um segmento inteiro de 16 MB); subi-lo come o RPO.
archive_timeout = 60s

# O `archive_command` delega no pgBackRest com `--async`, que e o que faz o
# `archive-async=y` do `pgbackrest.conf` valer alguma coisa: o comando entrega a
# fila local e volta, em vez de esperar pela rede.
#
# **O `%p` nao se cita por acidente:** o caminho vem do Postgres e nao do
# ambiente, e e relativo ao `PGDATA`.
archive_command = 'pgbackrest --stanza=kamba archive-push --async %p'

# ------------------------------------------------------------------- o WAL
#
# `wal_level = replica` e o minimo que o arquivo exige. Nao se poe `logical`:
# `logical` e para replicacao logica, que este ticket nao traz, e custa volume
# de WAL — mais volume de WAL com um destino inalcancavel e o disco a encher
# mais depressa.
wal_level = replica

# Quantos processos empurram WAL em paralelo. Dois, e nao mais: o `postgres` tem
# `cpus: 2.0` no compose de producao, e um terceiro competia com as consultas.
max_wal_senders = 3
wal_compression = on

# ------------------------------------------------------------ a recuperacao
#
# `restore_command` nao vai aqui: pertence ao *host* de restauro e nao ao de
# producao. Escreve-lo no `postgresql.conf` de producao nao faz nada em
# funcionamento normal e e um pe-de-cabra se alguem arrancar o cluster com um
# `recovery.signal` por engano. O restauro compoe-no por `pgbackrest restore`,
# que escreve a configuracao de recuperacao ele proprio.
#
# O **PITR de 7 dias** nao e uma chave deste ficheiro: vive na retencao de
# arquivo do `pgbackrest.conf` (`repo1-retention-archive=7`). Fica dito aqui
# porque este e o ficheiro onde um leitor vai procurar os «7 dias» e nao os vai
# encontrar.
