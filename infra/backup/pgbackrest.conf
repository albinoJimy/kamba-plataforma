# Configuracao do pgBackRest da KAMBA — KAM-079
#
# Fonte: `docs/tecnica/09_Topologia_Operacao_Escala.md` §8.1. Cada numero daqui
# tem de concordar com o `cobertura.yaml` ao lado, e e o
# `tools/backup_lint` que os confronta: um `repo1-retention-full` mudado aqui e
# nao la (ou o contrario) poe o *lint* vermelho e diz **qual** dos dois mudou.
#
# ============================================================================
# ESTE FICHEIRO NAO ESTA LIGADO A NADA, E ISSO E DELIBERADO
# ============================================================================
#
# **O compose de producao nao o monta.** Montar e ligar o `archive_mode` sem um
# `repo1` alcancavel nao e «comecar a fazer backups»: e um `archive_command` que
# falha a cada 60 s, WAL que o Postgres deixa de poder reciclar, e o disco do
# `postgres` a encher ate o cluster parar de aceitar escritas. Isto nao e
# hipotese: e o modo de falha documentado do arquivo de WAL, e seria um defeito
# de disponibilidade introduzido por um ticket de backups.
#
# E o `repo1` **nao tem destino**. A D1 (KAM-105) nao escolheu jurisdicao nem
# fornecedor; o `docs/tecnica/09` §5.3 da a regra de trabalho e nao da o
# fornecedor. Por isso o `repo1-path` **nao esta neste ficheiro**: vem do
# `PGBACKREST_REPO1_PATH` (ver SEGREDOS, abaixo), e sem ele o pgBackRest para
# com «missing required option» — a recusa e dele e nao de uma convencao.
# A primeira versao escrevia-o como `${NOME:?razao}`, o padrao que o compose de
# producao usa; o pgBackRest **nao expande** isso, e lia-o como valor.
#
# Quem a liga, e com que: o KAM-105 decide o destino, o KAM-077 poe o *host* de
# producao de pe, e o *host* de backup que **puxa** (a alternativa que o bloco
# nomeia contra *ransomware*) e um segundo *host* que a D1 tambem decide.
#
# ============================================================================
# PORQUE E QUE O PGBACKREST NAO E UM SERVICO DO COMPOSE DE PRODUCAO
# ============================================================================
#
# Tres razoes medidas, e a terceira e a que fecha a questao:
#
# 1. **A rede.** O `postgres` esta so em `data`, que e `internal: true` e **sem
#    DNS para fora** — medido pelo KAM-076 (`docs/evidencia/KAM-076.md` §2: dez
#    destinos, dez `gaierror`). Um pgBackRest que corra junto do Postgres nao
#    alcanca repositorio nenhum. O comentario das redes do
#    `docker-compose.prod.yml` ja escreve a intencao certa: o pgBackRest vive em
#    `ops` e sai pelo `proxy-saida`. Isso exige que o `proxy-saida` tenha o
#    FQDN do `repo1` na allowlist, e nao tem — ver o `cobertura.yaml`.
#
# 2. **O destino sem dono.** A allowlist de `infra/egress/proxy-saida.yaml`
#    impoe os dois sentidos: todo o destino aprovado e declarado por um servico,
#    e todo o destino declarado esta aprovado. Um `repo1` sem FQDN nao da nenhum
#    dos dois lados.
#
# 3. **O orcamento de memoria do conjunto reduzido.** Medido:
#    `tools/compose_prod/tests/test_lint.py:58` prende a soma do manifesto a
#    **24 064 MiB exactos**, que e a soma das linhas de limites propostos do
#    **bloco do KAM-076**. Um servico novo e memoria que aquela proposta nao
#    contem, e mudar aquela igualdade e mudar a medicao de outro ticket. O
#    acrescento legitimo e com o ticket que traga o `repo1`.
#
# ============================================================================
# SEGREDOS
# ============================================================================
#
# Nao ha nenhum valor de segredo aqui, e o mecanismo pelo qual nao ha **foi
# medido contra o binario** e nao deduzido.
#
# A primeira versao deste ficheiro escrevia as chaves sensiveis como
# `${NOME:?razao}` e afirmava, em seis sitios, que isso fazia a configuracao
# «recusar-se a funcionar sem destino em vez de funcionar contra um palpite».
# **Era falso.** O pgBackRest nao expande variaveis de ambiente dentro do
# ficheiro; le o texto literalmente. Medido com pgBackRest 2.45:
#
#   $ printf '[global]\nrepo1-path=${KAMBA_X:?razao}\n...' > /tmp/pgb.conf
#   $ pgbackrest --config=/tmp/pgb.conf --stanza=k info
#   ERROR: [032]: '${KAMBA_X:?razao}' must begin with / for 'repo1-path' option
#
# O mecanismo que o pgBackRest **tem** para isto e a variavel de ambiente
# `PGBACKREST_<OPCAO>`, e essa funciona — medido na mesma versao:
#
#   $ PGBACKREST_REPO1_PATH=/tmp/r pgbackrest --config=/dev/null --stanza=k info
#   stanza: k
#       status: error (missing stanza path)   # aceitou o caminho do ambiente
#
# Pelo que as chaves sensiveis **nao estao neste ficheiro**, nem como valor nem
# como marcador. Ficam ausentes, e quem implanta da-as pelo ambiente:
#
#   repo1-host        <- PGBACKREST_REPO1_HOST        (D1/KAM-105 decide)
#   repo1-host-user   <- PGBACKREST_REPO1_HOST_USER
#   repo1-path        <- PGBACKREST_REPO1_PATH
#   repo1-cipher-pass <- PGBACKREST_REPO1_CIPHER_PASS (cofre:
#                        `backup_repo_cifra_passphrase`)
#   pg1-path          <- PGBACKREST_PG1_PATH
#   pg1-database      <- PGBACKREST_PG1_DATABASE
#
# **A recusa passou a ser real, e e do proprio pgBackRest:** sem a opcao no
# ficheiro nem no ambiente, ele para com «missing required option». Isso e mais
# forte do que o marcador que a primeira versao escrevia, porque nao depende de
# ninguem render o ficheiro antes de o montar — e nada neste repositorio o
# renderizava.
#
# **Uma** das seis e segredo — o `repo1-cipher-pass`, que e o
# `backup_repo_cifra_passphrase` do `ops/secrets-inventory.yaml`. As outras
# cinco sao **valores de implantacao**: um FQDN, um utilizador, dois caminhos e
# um nome de base de dados nao sao segredos, e tratar tudo como segredo faz o
# inventario deixar de dizer o que protege. (A primeira versao punha o
# `pg1-database` numa lista chamada «chaves de segredo»; era um erro de
# categoria que a revisao adversarial apanhou.)
#
# **A segunda entrada do inventario, `backup_repo_credenciais`, nao tem chave
# nenhuma nesta configuracao, e isso fica dito em vez de disfarcado.** A
# primeira versao escrevia que «a passphrase da cifra **e as credenciais do
# repositorio** entram por referencia de ambiente»: so a passphrase entra. O
# transporte e SSH (`repo1-host-user` mais uma chave no `authorized_keys` do
# host de backup), pelo que as credenciais que a entrada declara — com as duas
# instancias `/escrita` e `/leitura` — sao consumidas pelo **host do
# repositorio** e nao por este ficheiro. A entrada fica, porque e onde a
# separacao de perfis esta declarada; o consumidor e que nao existe ate a D1
# decidir.
#
# O `tools/backup_lint` prende as duas categorias com a mesma regra
# (`segredo-em-claro` para a passphrase, `valor-de-implantacao` para as outras
# cinco: nenhuma das seis aparece neste ficheiro) e com uma segunda
# (`ambiente-nao-documentado`: o cabecalho nomeia o `PGBACKREST_*` de cada uma),
# as duas com caso de canario. O `scan_secrets` varre a arvore toda.
#
# **A copia offline da chave** (criterio 6) e um procedimento e nao uma linha de
# configuracao: sem ela o backup e inutil, o que e exactamente o que o
# `docs/tecnica/09` §8.1 escreve. O procedimento e o KAM-083 (runbooks); o que
# este ticket deixa e a entrada no inventario de segredos, com
# `rotacao_gatilho`. **O que este ticket NAO deixa, e que a primeira versao
# afirmava deixar:** um predicado que verifique que a chave usada no restauro
# nao e a credencial com que producao escreve. Nao existe, nem em
# `tools/backup_lint/politica.py` nem em regra de *lint* — e nao se escreve sem
# um `repo1` onde haja dois perfis para comparar. Credores: **D1 (KAM-105)** e
# **KAM-083**.

[global]

# --------------------------------------------------------------- o repositorio
#
# `repo1` noutro dominio de falha, fora do *host* primario (criterio 7). O
# `posix` com `repo1-host` faz o pgBackRest falar com um *host* remoto por SSH.
#
# **Isto e `push`, e `push` nao e a defesa anti-*ransomware* que o bloco nomeia
# — a primeira versao deste comentario dizia que era, e estava errada.** Com
# `repo1-host` deste lado, quem detem a credencial e **escreve** no repositorio
# e producao; credenciais de producao comprometidas apagam os backups. O
# desenho de *pull* do pgBackRest e o inverso: a configuracao vive no **host do
# repositorio**, com `pg1-host` a apontar para a base, e e la que o `backup` e
# o `expire` correm — no host da base «`pg1-path` is required to be the path of
# the local PostgreSQL cluster and no `pg1-host` should be configured». E a
# forma que cumpre o «restauro sem acesso de escrita a partir de producao» do
# `docs/tecnica/09` §8.3, citado 20 linhas abaixo.
#
# Este ficheiro e o lado de **producao** e nao se finge o contrario. O lado do
# repositorio e um **segundo ficheiro noutro host**, que nao existe porque o
# host nao existe: credor **D1 (KAM-105)**. Enquanto for `push`, a mitigacao que
# resta e o *object lock* no destino, e esse esta `nao_verificado` no
# `cobertura.yaml` com a razao escrita.
#
# `repo1-host`, `repo1-host-user` e `repo1-path` **nao estao aqui**: vem do
# ambiente (ver SEGREDOS, acima). Sem elas o pgBackRest para com «missing
# required option», que e a recusa que se queria.
repo1-type=posix

# Cifra do repositorio, AES-256 (criterio 1, `docs/tecnica/09` §8.1). A
# passphrase vem do cofre pelo `PGBACKREST_REPO1_CIPHER_PASS` e **nao** por uma
# linha neste ficheiro. O `repo1-cipher-type` fica escrito porque nao e segredo
# e porque e ele que o *lint* confronta com o `cobertura.yaml`.
repo1-cipher-type=aes-256-cbc

# --------------------------------------------------------------- a retencao
#
# «PITR 7 dias; retencao 35 dias» (criterio 1). **Nenhuma destas chaves conta
# dias.** A documentacao do pgBackRest escreve, para a
# `repo-retention-archive`: «Number of backups worth of continuous WAL to
# retain» — contagem de **backups**. Comparar «7» com «7 dias» e ler a chave
# errada, e a traducao de cada uma tem de estar escrita:
#
#   repo1-retention-full=5         5 completos x 1 por semana = 35 dias
#   repo1-retention-archive=7      7 **diferenciais**, e o ciclo faz um por
#                                  dia (`cobertura.yaml: ciclo.diferencial`),
#                                  logo 7 diferenciais = 7 dias de WAL
#
# A segunda linha so e verdade por causa da seguinte, e e aqui que estava o
# defeito que a revisao adversarial mediu. Com `repo1-retention-archive-type`
# em **`full`**, a documentacao retem o WAL dos ultimos N backups **completos**;
# com `repo1-retention-archive=7` e so **5** completos retidos, isso retem o WAL
# de **todos** eles — cerca de **35 dias de WAL** e nao 7. Nao e so custo: o
# `docs/tecnica/08` §11 escreve «WAL 7 dias (PITR) + diarios 35 dias», pelo que
# 35 dias de WAL e **sobre-retencao de dados pessoais contra a politica
# escrita**.
#
# Fica `diff`, e a escolha e um desvio consciente a documentacao, que diz «It is
# recommended that this setting not be changed from the default» (a omissao e
# `full`). As duas razoes do desvio, para quem o quiser reverter numa linha:
#
#  1. com um diferencial **diario**, `diff` + 7 da uma janela de PITR **estavel**
#     de 7 dias; `full` + 1 daria uma janela que oscila entre 0 e 7 dias
#     conforme o dia da semana em que se pergunta, e «PITR 7 dias» na politica
#     le-se como garantia e nao como maximo;
#  2. o modo de falha do desvio e **seguro na direccao certa**: se o diferencial
#     diario deixar de correr, 7 diferenciais passam a cobrir mais do que 7
#     dias — retem-se WAL a mais, nunca a menos.
#
# O que se perde com `diff`, dito: entre dois completos retidos ja expirados o
# WAL intermedio sai, pelo que um completo de ha 30 dias restaura para o **fim
# dele** e nao para um instante arbitrario daquela semana. E exactamente o que a
# politica do §11 descreve — PITR na janela de 7 dias, retencao de 35 — e nao
# uma perda silenciosa.
repo1-retention-full=5
repo1-retention-full-type=count
repo1-retention-diff=7
repo1-retention-archive=7
repo1-retention-archive-type=diff

# --------------------------------------------------------------- o arquivo
#
# `archive-async` com fila local: sem ele, cada mudanca de segmento de WAL
# espera pela rede, e uma rede lenta transforma-se em latencia de escrita no
# Postgres.
#
# **O tecto da fila nao e uma seguranca gratis, e o que ele custa tem de estar
# escrito ao lado dele.** A documentacao da `archive-push-queue-max` diz que ao
# atingir o limite «pgBackRest will notify PostgreSQL that the WAL was
# successfully archived, then DROP IT», e que «the archive log stream will be
# interrupted and PITR will not be possible past that point»; em modo
# assincrono o que se descarta e a **fila inteira**. Ou seja: o tecto troca uma
# **falha de disponibilidade** (o `pg_wal` a crescer ate o disco encher e o
# cluster parar de aceitar escritas) por uma **perda silenciosa da cadeia de
# WAL** — que para um ticket de backups e o resultado pior dos dois, porque nao
# se ve ate alguem tentar restaurar.
#
# Fica o tecto, e fica com a condicao: **um alerta na idade do WAL e o que torna
# esta troca aceitavel.** O `backup_wal_idade_segundos` existe declarado e
# **nenhum processo o serve** hoje (agendador: KAM-071/KAM-078), pelo que ate
# ele correr o descarte seria mesmo silencioso. Esta e a razao pela qual o
# `cobertura.yaml` marca o alerta do WAL como `configurado` e nao `coberto`, e
# nao e uma formalidade: sem ele, 1 GiB de fila e o ponto a partir do qual o
# PITR deixa de existir sem ninguem saber.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=1GiB

# Compressao antes da cifra. A ordem importa: cifrar primeiro produz dados
# incompressiveis, e o pgBackRest faz o certo (comprime e depois cifra) — fica
# dito porque e a pergunta que se faz ao ler as duas linhas juntas.
compress-type=zst
compress-level=3

# ------------------------------------------------------------ a verificacao
#
# `repo1-bundle` junta ficheiros pequenos num so objecto: as bases do Piloto tem
# muitos ficheiros pequenos (`pg_catalog`), e sem isto o restauro de 20 GB e
# dominado por latencia por objecto e nao por debito — o que faria o orcamento
# dos 30 min do §8.2 falhar por uma razao que nao e a largura de banda.
repo1-bundle=y

# Soma de verificacao por pagina. **Esta chave nao cria somas de verificacao, e
# hoje nao tem nada para ler.** A documentacao diz que a opcao «is enabled
# automatically when data page checksums are enabled on the cluster»: quem as
# cria e o `initdb --data-checksums`, e medido na arvore
# (`grep -rn POSTGRES_INITDB_ARGS infra/`) os tres composes passam so
# `--auth-host=scram-sha-256` — **nenhum** liga as somas. A documentacao
# acrescenta que «failures in checksum validation will not abort a backup»,
# pelo que nem num cluster que as tivesse isto seria uma barreira.
#
# Fica escrita porque e barata e porque passa a valer no dia em que o cluster
# nascer com `--data-checksums` — e **essa** e a linha que falta, no compose e
# nao aqui. Ligar as somas num cluster existente exige `pg_checksums` com o
# cluster parado, que e uma operacao de janela de manutencao; nao ha producao
# para a agendar e o ticket que criar o cluster do destino e que a paga.
# Credor: **D1 (KAM-105)**, com o `repo1`.
checksum-page=y

# O registo nunca leva segredos. O `detail` e o nivel que o `pgbackrest check`
# precisa para dizer **porque** falhou; `log-level-console=info` mantem a saida
# legivel num *job*.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# ============================================================== a stanza
#
# Uma stanza para o cluster inteiro. O pgBackRest faz backup por **cluster** e
# nao por base: as tres bases do criterio — `platform`, `medusa` e `chatwoot` —
# vivem no mesmo cluster (`infra/compose/postgres/initdb/01-bases-e-extensoes.sql`)
# e uma stanza cobre-as as tres. Esta frase esta aqui porque a leitura natural
# do criterio («as bases `platform`, `medusa` e `chatwoot`») sugere tres
# configuracoes, e tres stanzas sobre o mesmo cluster seriam tres copias dos
# mesmos ficheiros.
[kamba]
# `pg1-path` e `pg1-database` **nao estao aqui**: vem do `PGBACKREST_PG1_PATH` e
# do `PGBACKREST_PG1_DATABASE` (ver SEGREDOS, acima). O `pg1-port` fica, porque
# 5432 e o valor do compose e nao um palpite.
pg1-port=5432

# As credenciais de **leitura** do restauro sao distintas das de escrita de
# producao (defesa contra *ransomware*, `docs/tecnica/09` §8.3). **A separacao
# esta no `ops/secrets-inventory.yaml`** — a entrada `backup_repo_credenciais`
# declara duas instancias, `/escrita` e `/leitura` — e **nao** no
# `cobertura.yaml`, cujo bloco `anti_ransomware` tem quatro chaves e nenhum
# perfil. Nenhuma regra de *lint* confronta os dois perfis: para isso seria
# preciso um `repo1` onde as permissoes existissem, e nao ha. Credor: **D1
# (KAM-105)**.
#
# O perfil de restauro vive no *host* de backup e nao aqui — ver a nota de
# `push` contra *pull* na seccao do repositorio, acima.
