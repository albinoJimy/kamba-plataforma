# Configuracao do pgBackRest da KAMBA — KAM-079
#
# Fonte: `docs/tecnica/09_Topologia_Operacao_Escala.md` §8.1. Cada numero daqui
# tem de concordar com o `cobertura.yaml` ao lado, e e o
# `tools/backup_lint` que os confronta: um `repo1-retention-full` mudado aqui e
# nao la (ou o contrario) poe o *lint* vermelho e diz **qual** dos dois mudou.
#
# ============================================================================
# ESTE FICHEIRO NAO ESTA LIGADO A NADA, E ISSO E DELIBERADO
# ============================================================================
#
# **O compose de producao nao o monta.** Montar e ligar o `archive_mode` sem um
# `repo1` alcancavel nao e «comecar a fazer backups»: e um `archive_command` que
# falha a cada 60 s, WAL que o Postgres deixa de poder reciclar, e o disco do
# `postgres` a encher ate o cluster parar de aceitar escritas. Isto nao e
# hipotese: e o modo de falha documentado do arquivo de WAL, e seria um defeito
# de disponibilidade introduzido por um ticket de backups.
#
# E o `repo1` **nao tem destino**. A D1 (KAM-105) nao escolheu jurisdicao nem
# fornecedor; o `docs/tecnica/09` §5.3 da a regra de trabalho e nao da o
# fornecedor. O `repo1-path` abaixo esta escrito como **referencia de ambiente
# sem valor por omissao** (`${...:?}`, o padrao que o compose de producao usa
# para segredos) precisamente para que esta configuracao **se recuse a
# funcionar** sem um destino decidido, em vez de funcionar contra um palpite.
#
# Quem a liga, e com que: o KAM-105 decide o destino, o KAM-077 poe o *host* de
# producao de pe, e o *host* de backup que **puxa** (a alternativa que o bloco
# nomeia contra *ransomware*) e um segundo *host* que a D1 tambem decide.
#
# ============================================================================
# PORQUE E QUE O PGBACKREST NAO E UM SERVICO DO COMPOSE DE PRODUCAO
# ============================================================================
#
# Tres razoes medidas, e a terceira e a que fecha a questao:
#
# 1. **A rede.** O `postgres` esta so em `data`, que e `internal: true` e **sem
#    DNS para fora** — medido pelo KAM-076 (`docs/evidencia/KAM-076.md` §2: dez
#    destinos, dez `gaierror`). Um pgBackRest que corra junto do Postgres nao
#    alcanca repositorio nenhum. O comentario das redes do
#    `docker-compose.prod.yml` ja escreve a intencao certa: o pgBackRest vive em
#    `ops` e sai pelo `proxy-saida`. Isso exige que o `proxy-saida` tenha o
#    FQDN do `repo1` na allowlist, e nao tem — ver o `cobertura.yaml`.
#
# 2. **O destino sem dono.** A allowlist de `infra/egress/proxy-saida.yaml`
#    impoe os dois sentidos: todo o destino aprovado e declarado por um servico,
#    e todo o destino declarado esta aprovado. Um `repo1` sem FQDN nao da nenhum
#    dos dois lados.
#
# 3. **O orcamento de memoria do conjunto reduzido.** Medido:
#    `tools/compose_prod/tests/test_lint.py:58` prende a soma do manifesto a
#    **24 064 MiB exactos**, que e a soma das linhas de limites propostos do
#    **bloco do KAM-076**. Um servico novo e memoria que aquela proposta nao
#    contem, e mudar aquela igualdade e mudar a medicao de outro ticket. O
#    acrescento legitimo e com o ticket que traga o `repo1`.
#
# ============================================================================
# SEGREDOS
# ============================================================================
#
# Nao ha nenhum valor de segredo aqui. A passphrase da cifra e as credenciais
# do repositorio entram por referencia de ambiente e estao em
# `ops/secrets-inventory.yaml` (`backup_repo_cifra_passphrase` e
# `backup_repo_credenciais`). O `tools/backup_lint` tem uma regra
# (`segredo-em-claro`) com caso de canario que falha se alguem escrever um
# valor literal numa destas chaves, e o `scan_secrets` varre a arvore toda.
#
# **A copia offline da chave** (criterio 6) e um procedimento e nao uma linha de
# configuracao: sem ela o backup e inutil, o que e exactamente o que o
# `docs/tecnica/09` §8.1 escreve. O procedimento e o KAM-083 (runbooks); o que
# este ticket deixa e a entrada no inventario de segredos, com
# `rotacao_gatilho`, e o predicado que verifica que a chave usada no restauro
# **nao** e a mesma credencial com que producao escreve.

[global]

# --------------------------------------------------------------- o repositorio
#
# `repo1` noutro dominio de falha, fora do *host* primario (criterio 7). O
# `posix` aqui e o tipo de **transporte local**: o `repo1-host` abaixo faz o
# pgBackRest falar com um *host* remoto por SSH, que e a forma que o bloco
# nomeia como alternativa de *pull*. Nem `repo1-host` nem `repo1-path` tem valor
# por omissao: sem a D1 decidida, esta configuracao recusa-se a arrancar.
repo1-type=posix
repo1-host=${KAMBA_BACKUP_REPO1_HOST:?a D1 (KAM-105) decide o destino do repo1}
repo1-host-user=${KAMBA_BACKUP_REPO1_USER:?o utilizador do host de backup}
repo1-path=${KAMBA_BACKUP_REPO1_PATH:?o caminho do repositorio no host de backup}

# Cifra do repositorio, AES-256 (criterio 1, `docs/tecnica/09` §8.1). A
# passphrase vem do cofre; aqui so a referencia.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${KAMBA_BACKUP_REPO_CIFRA_PASSPHRASE:?do cofre (backup_repo_cifra_passphrase)}

# --------------------------------------------------------------- a retencao
#
# «PITR 7 dias; retencao 35 dias» (criterio 1). As duas linhas abaixo sao a
# traducao para as unidades que o pgBackRest conta, e a traducao esta escrita no
# `cobertura.yaml` para que ninguem compare 35 com 5 e conclua que um dos dois
# esta errado:
#
#   repo1-retention-full=5       5 completos x 1 por semana = 35 dias
#   repo1-retention-archive=7    o WAL que o PITR de 7 dias precisa
#
# `repo1-retention-archive-type=full` prende o WAL ao backup **completo** e nao
# ao diferencial: prende-lo ao diferencial expirava o WAL em 7 dias contados
# desde o ultimo diferencial, o que e menos do que 7 dias de PITR.
repo1-retention-full=5
repo1-retention-full-type=count
repo1-retention-diff=7
repo1-retention-archive=7
repo1-retention-archive-type=full

# --------------------------------------------------------------- o arquivo
#
# `archive-async` com fila local: sem ele, cada mudanca de segmento de WAL
# espera pela rede, e uma rede lenta transforma-se em latencia de escrita no
# Postgres. A fila tem tecto, porque uma fila sem tecto e o disco cheio outra
# vez — so mais tarde.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=1GiB

# Compressao antes da cifra. A ordem importa: cifrar primeiro produz dados
# incompressiveis, e o pgBackRest faz o certo (comprime e depois cifra) — fica
# dito porque e a pergunta que se faz ao ler as duas linhas juntas.
compress-type=zst
compress-level=3

# ------------------------------------------------------------ a verificacao
#
# `repo1-bundle` junta ficheiros pequenos num so objecto: as bases do Piloto tem
# muitos ficheiros pequenos (`pg_catalog`), e sem isto o restauro de 20 GB e
# dominado por latencia por objecto e nao por debito — o que faria o orcamento
# dos 30 min do §8.2 falhar por uma razao que nao e a largura de banda.
repo1-bundle=y

# Soma de verificacao por pagina, que e o que torna a corrupcao silenciosa
# detectavel no backup e nao so no restauro.
checksum-page=y

# O registo nunca leva segredos. O `detail` e o nivel que o `pgbackrest check`
# precisa para dizer **porque** falhou; `log-level-console=info` mantem a saida
# legivel num *job*.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# ============================================================== a stanza
#
# Uma stanza para o cluster inteiro. O pgBackRest faz backup por **cluster** e
# nao por base: as tres bases do criterio — `platform`, `medusa` e `chatwoot` —
# vivem no mesmo cluster (`infra/compose/postgres/initdb/01-bases-e-extensoes.sql`)
# e uma stanza cobre-as as tres. Esta frase esta aqui porque a leitura natural
# do criterio («as bases `platform`, `medusa` e `chatwoot`») sugere tres
# configuracoes, e tres stanzas sobre o mesmo cluster seriam tres copias dos
# mesmos ficheiros.
[kamba]
pg1-path=${KAMBA_BACKUP_PG1_PATH:?o PGDATA do cluster; ver a nota do volume no compose}
pg1-port=5432
pg1-database=${KAMBA_BACKUP_PG1_DATABASE:?a base de onde se chama o pg_start_backup}

# As credenciais de **leitura** do restauro sao distintas das de escrita de
# producao (defesa contra *ransomware*, `docs/tecnica/09` §8.3). A separacao
# esta no `cobertura.yaml` (`anti_ransomware`) e o perfil de restauro vive no
# *host* de backup, nao aqui: um `repo1` que producao possa reescrever nao
# resiste a credenciais comprometidas, e e por isso que a alternativa do bloco e
# um *host* que **puxa**.
