# infra/envs/prod/env.yaml — ambiente `prod` (KAM-075)
#
# A FONTE MAQUINAVEL da linha `prod` da matriz (`infra/ENVIRONMENTS.md` §2).
#
# LEIA-SE A PRIMEIRA LINHA DE `dados` ANTES DO RESTO. Este `prod` arranca em
# `synthetic`, e nao por cautela: a Carta §4.2 diz «sem D1 nao ha dados reais»,
# e o `docs/tecnica/evidencia/validacao/GoLive_Gate.md` mede-o linha a linha —
# hoje nenhuma linha obrigatoria esta satisfeita. Um `prod` sintetico e o estado
# CORRECTO deste produto, nao um estado intermedio.

versao: 1
ambiente: prod

# --- Dados (doc 09 §6, linha «Dados») ----------------------------------------
dados:
  # O `kamba_data_class` do criterio 4. Passar isto a `real` exige as DUAS
  # referencias abaixo preenchidas, e o `env_lint` recusa com `real-sem-d1` ou
  # `real-sem-apd-ref`. Nao e uma convencao: e o gate 2 a falhar.
  classe: synthetic
  # Referencia da decisao D1 (alojamento). `null` porque a D1 esta `em branco`:
  # linha A1 do `GoLive_Gate.md`, dependente de >= 3 cotacoes das quais nenhuma
  # foi pedida. E decisao do fundador, nao deste ticket.
  decisao_d1: null
  # Numeros de protocolo da APD, um por destino. `[]` porque sao **0 de 14** os
  # destinos com `apd_ref` (linha B2 do `GoLive_Gate.md`); a folha de seguimento
  # e `Seguimento_APD.md`, e nasceu vazia de proposito.
  apd_refs: []
  # `prod` nao aceita restauro de nenhum outro ambiente. A lista existe nos tres
  # ficheiros para que a regra seja uma so; aqui esta vazia porque um restauro
  # para `prod` vem do repositorio de copias (KAM-079), nao de um ambiente.
  restauro_de: []

# --- Compute (doc 09 §6, linha «Compute») ------------------------------------
compute:
  forma: 8vcpu-32gb
  vcpu: 8
  memoria_gb: 32
  # NVMe >= 200 GB no perfil P0 do doc 09 §4.4. O tamanho nao esta neste
  # ficheiro: e um parametro do modulo `host-base`, porque cresce com a base de
  # dados e o doc 09 §8.2 avisa que acima de 40 GB o RTO de 2 h deixa de ser
  # seguro.
  disco: nvme

# --- Meta (doc 09 §6, linha «Meta») ------------------------------------------
meta:
  # Numeros dos clientes via Embedded Signup v4.
  modo: producao
  assina_corpo: true

# --- Facilitador de pagamentos (doc 09 §6, linha «Facilitador») --------------
facilitador:
  # Producao por PME. O *endpoint* de producao NAO esta aqui: depende do
  # facilitador contratado por PME, e o enquadramento BNA do modelo facilitador
  # «aguarda parecer» (D8, doc 09 §19). Escrever um *endpoint* de producao hoje
  # era fixar uma decisao que nao e minha.
  modo: producao
  proxypay_base: null
  sandbox_appypay: nao-aplicavel

# --- LLM (doc 09 §6, linha «LLM») --------------------------------------------
llm:
  modo: chaves-virtuais-por-tenant
  budget: por-tenant

# --- Segredos (doc 09 §6, linha «Segredos») ----------------------------------
#
# ESTE E O MAPEAMENTO do criterio 5. O projecto chama-se `prod` porque e o nome
# que o doc 09 §6 lhe da: «Projecto `prod`».
#
# A SEGUNDA METADE DA LINHA DO DOC 09 §6 — «chaves Meta e do facilitador
# distintas por ambiente» — cumpre-se por construcao e nao por disciplina: a
# referencia de um segredo deriva do projecto do seu ambiente, pelo que tres
# projectos distintos dao tres referencias distintas. O `env_lint` nao assume
# isso: calcula as tres e exige que sejam diferentes duas a duas.
segredos:
  projecto: prod
  cofre: doppler

# --- Acesso (doc 09 §6, linha «Acesso») --------------------------------------
acesso:
  # *Break-glass* auditado. O registo vai para `audit_log` — a tabela do
  # KAM-003, nao uma nova. Quem AUDITA o acesso e observabilidade (KAM-080); o
  # que este ficheiro declara e que `prod` nao tem acesso de equipa.
  modo: break-glass-auditado

# --- DNS (Detalhes Tecnicos do KAM-075) --------------------------------------
dns:
  # *Proposta* (300 s), pre-configurada para o passo «DNS» do orcamento de RTO
  # (doc 09 §8.2: 15 min de verificacao e DNS). O TTL baixo reduz o tempo de
  # propagacao numa troca de *host*; quanto reduz na pratica NAO FOI MEDIDO, e
  # medir e do KAM-085 (simulacro de DR cronometrado).
  ttl_segundos: 300

# --- Custo (ADR-018; criterio 7) ---------------------------------------------
custo:
  etiquetas:
    kamba_env: prod
    # Segue `dados.classe`, e o `env_lint` exige a igualdade. No dia em que a
    # classe passar a `real`, esta etiqueta passa com ela — e a conta de custo
    # passa a distinguir um recurso com dados reais de um sem.
    kamba_data_class: synthetic
  # NAO VERIFICADO — nenhuma cotacao pedida (ver `infra/ENVIRONMENTS.md` §6).
  mensal_usd: null
