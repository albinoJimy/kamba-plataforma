# infra/envs/staging/env.yaml — ambiente `staging` (KAM-075)
#
# A FONTE MAQUINAVEL da linha `staging` da matriz (`infra/ENVIRONMENTS.md` §2).
#
# `staging` e o ambiente que o resto do backlog espera: o criterio de saida do
# EPIC-03 exige latencia p95 e custo de IA «medidos no staging com numero de
# teste», e o CA9 do KAM-010 espera um `staging` para cronometrar a exportacao
# de segredos. NADA DISSO SE MEDE HOJE: este ficheiro descreve o ambiente; nao
# o levanta, porque levantar depende da D1.

versao: 1
ambiente: staging

# --- Dados (doc 09 §6, linha «Dados») ----------------------------------------
dados:
  # «Sinteticos (NUNCA copia de prod)», em maiusculas no doc 09 §6. O `null` do
  # `decisao_d1` e a lista vazia de `apd_refs` nao sao um estado transitorio a
  # preencher: sao o que impede `classe: real`.
  classe: synthetic
  decisao_d1: null
  apd_refs: []
  # O CONTROLO DO CRITERIO 3, e o unico mecanismo que hoje impede o que a linha
  # D10t do `GoLive_Gate.md` diz estar «satisfeito por desenho e nao por
  # medicao»: por `prod` nesta lista e o gate 2 falha com `restauro-de-prod`.
  restauro_de: []

# --- Compute (doc 09 §6, linha «Compute») ------------------------------------
compute:
  forma: 4vcpu-16gb
  vcpu: 4
  memoria_gb: 16
  disco: nvme

# --- Meta (doc 09 §6, linha «Meta») ------------------------------------------
meta:
  # Numero de teste da app Meta de *staging* (WABA de teste).
  #
  # O que isto NAO prova, e o doc 09 §6 di-lo na nota final: coexistencia e
  # Embedded Signup em condicoes reais exigem um numero +244 real, e a
  # disponibilidade disso e INDICIO com confirmacao escrita pendente (D5). O
  # E2E de *staging* cobre mensagens, estados, templates e pagamentos.
  modo: numero-de-teste
  assina_corpo: true

# --- Facilitador de pagamentos (doc 09 §6, linha «Facilitador») --------------
facilitador:
  modo: sandbox
  # CONFIRMADO (doc 09 §6; bloco do KAM-075): nesta sandbox o OPG `900000000`
  # aceita, o `900002004` da *timeout* e o `900003000` recusa. Sao os tres
  # cenarios que o KAM-054 em diante usa para o caminho de pagamento.
  proxypay_base: api.sandbox.proxypay.co.ao
  # INDICIO, nao CONFIRMADO: a sandbox AppyPay e afirmada pelo doc 09 §6 sem
  # fonte primaria. Fica com o estado em vez de um *endpoint* inventado — e
  # por isso o `env_lint` nao exige nenhum aqui.
  sandbox_appypay: indicio

# --- LLM (doc 09 §6, linha «LLM») --------------------------------------------
llm:
  # Chave propria do LiteLLM, *budget* baixo. O Langfuse v4 corre **so aqui** e
  # so com dados sinteticos (doc 09 §6, §9.3) — mas isso e observabilidade, e
  # observabilidade e o KAM-080.
  modo: chave-propria
  budget: baixo

# --- Segredos (doc 09 §6, linha «Segredos») ----------------------------------
#
# ESTE E O MAPEAMENTO do criterio 5. O projecto chama-se `staging` porque e o
# nome que o doc 09 §6 lhe da: «Projecto Doppler `staging`».
#
# OS PROJECTOS SAO CRIADOS PELO KAM-010. Este ficheiro so declara qual pertence
# a que ambiente; o `env_lint` falha quando uma referencia de segredo escrita
# em `infra/envs/staging/` usar o projecto de outro ambiente.
segredos:
  projecto: staging
  cofre: doppler

# --- Acesso (doc 09 §6, linha «Acesso») --------------------------------------
acesso:
  modo: equipa

# --- DNS (Detalhes Tecnicos do KAM-075) --------------------------------------
dns:
  # *Proposta* (300 s). Nao medida: a propagacao real e do KAM-085.
  ttl_segundos: 300

# --- Custo (ADR-018; criterio 7) ---------------------------------------------
custo:
  etiquetas:
    kamba_env: staging
    kamba_data_class: synthetic
  # NAO VERIFICADO — nenhuma cotacao pedida (ver `infra/ENVIRONMENTS.md` §6).
  mensal_usd: null
