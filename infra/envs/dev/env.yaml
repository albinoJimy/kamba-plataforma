# infra/envs/dev/env.yaml — ambiente `dev` (KAM-075)
#
# A FONTE MAQUINAVEL da linha `dev` da matriz. O documento que a escreve para
# pessoas e `infra/ENVIRONMENTS.md` §2; o `tools/env_lint` le os dois e falha
# quando discordam. Nenhum dos dois e copia do outro: um tem a prosa, o outro
# tem os tokens, e o gate 2 e que os mantem iguais.
#
# O `dev` e o unico dos tres que corre hoje: e o Compose local do KAM-001
# (`infra/compose/docker-compose.dev.yml`). Nao tem *host*, nao tem fornecedor,
# e nao tem projecto de segredos remoto — e isso nao e uma lacuna, e a linha do
# doc 09 §6 («Local, nao reutilizaveis»).

versao: 1
ambiente: dev

# --- Dados (doc 09 §6, linha «Dados») ----------------------------------------
#
# `synthetic` em `dev` e `staging` nao e precaucao: e o que os poe fora do
# ambito dos Arts. 33.o-34.o da Lei 22/11 (doc 09 §5.3, ponto 2).
dados:
  classe: synthetic
  # As duas referencias que o criterio 4 exige para `classe: real`. Em `dev`
  # ficam vazias para sempre: `dev` nao tem dados reais por desenho, e nao ha
  # caminho previsto para os ter.
  decisao_d1: null
  apd_refs: []
  # De que ambientes este aceita restauro de copias de seguranca. Vazia em
  # todos os tres hoje; o `env_lint` recusa `prod` aqui (criterio 3).
  restauro_de: []

# --- Compute (doc 09 §6, linha «Compute») ------------------------------------
compute:
  forma: compose-local
  # Sem *host*: o Compose corre na maquina de quem desenvolve. Os tres campos
  # abaixo ficam nulos de proposito, e o `env_lint` exige que fiquem — um
  # `vcpu: 4` em `dev` seria uma forma de dizer que ha um *host* que nao ha.
  vcpu: null
  memoria_gb: null
  disco: null

# --- Meta (doc 09 §6, linha «Meta») ------------------------------------------
meta:
  modo: mock
  # O corpo do *webhook* vai assinado com um segredo de teste, para que o
  # caminho de verificacao da assinatura seja o mesmo em `dev` e em producao —
  # um `dev` que salte a verificacao esconde exactamente o defeito que ela
  # apanha. O simulador e `tools/meta-sim`.
  assina_corpo: true

# --- Facilitador de pagamentos (doc 09 §6, linha «Facilitador») --------------
facilitador:
  modo: mock
  # Nenhum *endpoint* de terceiro em `dev`. Os dois campos abaixo existem para
  # que a forma seja a mesma nos tres ficheiros e a comparacao com a matriz
  # possa ser por chave e nao por «este ambiente tem esta chave».
  proxypay_base: null
  sandbox_appypay: nao-aplicavel

# --- LLM (doc 09 §6, linha «LLM») --------------------------------------------
llm:
  modo: chave-de-teste
  budget: minimo

# --- Segredos (doc 09 §6, linha «Segredos») ----------------------------------
#
# ESTE E O MAPEAMENTO do criterio 5. O `projecto` e o unico valor que o decide;
# as referencias derivam dele, e nao se escrevem uma a uma — ver
# `tools/env_lint/README.md` §2.
#
# OS PROJECTOS SAO CRIADOS PELO KAM-010, QUE JA ESTA ENTREGUE. Este ficheiro so
# diz qual pertence a que ambiente, e o `env_lint` falha se o mapeamento for
# violado. Nao cria projectos e nao toca no cofre.
segredos:
  # `local` nao e um nome de projecto: e a ausencia de um. O doc 09 §6 diz
  # «Local, nao reutilizaveis», e o `env_lint` trata-o como valor reservado —
  # um segredo de `dev` nunca resolve para um cofre remoto.
  projecto: local
  cofre: nenhum

# --- Acesso (doc 09 §6, linha «Acesso») --------------------------------------
acesso:
  modo: equipa

# --- DNS (Detalhes Tecnicos do KAM-075) --------------------------------------
dns:
  # *Proposta* do bloco do ticket (300 s), nao medicao. O passo «DNS» do
  # orcamento de RTO sao 15 min no doc 09 §8.2, e a propagacao real mede-se no
  # KAM-085. Em `dev` nao ha DNS nenhum; o valor esta aqui para a forma ser a
  # mesma nos tres.
  ttl_segundos: 300

# --- Custo (ADR-018; criterio 7) ---------------------------------------------
custo:
  etiquetas:
    kamba_env: dev
    # Segue `dados.classe`. O `env_lint` exige que sejam iguais: uma etiqueta
    # que diga `synthetic` sobre um recurso com dados reais e pior do que nao
    # ter etiqueta, porque da garantia falsa a quem faz a conta.
    kamba_data_class: synthetic
  # NAO VERIFICADO. O criterio 7 pede «cotacao real (nao do doc 09)» e nao
  # existe nenhuma: `docs/tecnica/evidencia/validacao/Alojamento_Cotacoes.md`
  # registra «Nenhuma pedida». Um numero aqui seria inventado.
  mensal_usd: null
