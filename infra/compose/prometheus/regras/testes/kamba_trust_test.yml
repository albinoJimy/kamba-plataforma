# Testes de comportamento das regras de Trust & Safety — KAM-200 — e da do
# recalculo da confianca — KAM-203.
#
# `promtool test rules`, corrido por `make obs-promtool`. Cada teste prende um
# caso e o seu controlo: a primeira ocorrencia de uma serie que nasce a zero
# dispara, e o silencio nao dispara.

rule_files:
  - ../kamba-trust.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: "suspensao: a primeira suspensao dispara, e passada a janela resolve"
    input_series:
      - series: 'ts_sancoes_total{job="onboarding_lote",instance="onboarding-lote:3014",passo="suspensao",origem="humana"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: ts_suspensao_decidida
        exp_alerts: []
      - eval_time: 12m
        alertname: ts_suspensao_decidida
        exp_alerts:
          - exp_labels:
              severity: P3
              componente: gov
              job: onboarding_lote
              instance: onboarding-lote:3014
              passo: suspensao
              origem: humana
            exp_annotations:
              resumo: Trust & Safety decidiu suspender ou encerrar uma loja.
              qual_tenant: Le-se da platform.ts_sanction pelo lote; a metrica nao leva tenant (OBS-I).
              runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md
      - eval_time: 35m
        alertname: ts_suspensao_decidida
        exp_alerts: []

  - interval: 1m
    name: "encerramento: um encerramento decidido tambem dispara"
    input_series:
      - series: 'ts_sancoes_total{job="onboarding_lote",instance="onboarding-lote:3014",passo="encerramento",origem="humana"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ts_suspensao_decidida
        exp_alerts:
          - exp_labels:
              severity: P3
              componente: gov
              job: onboarding_lote
              instance: onboarding-lote:3014
              passo: encerramento
              origem: humana
            exp_annotations:
              resumo: Trust & Safety decidiu suspender ou encerrar uma loja.
              qual_tenant: Le-se da platform.ts_sanction pelo lote; a metrica nao leva tenant (OBS-I).
              runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md

  - interval: 1m
    name: "suspensao: um aviso ou uma limitacao nao e uma suspensao"
    input_series:
      - series: 'ts_sancoes_total{job="onboarding_lote",instance="onboarding-lote:3014",passo="limitacao",origem="automatica"}'
        values: '0x5 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ts_suspensao_decidida
        exp_alerts: []

  - interval: 1m
    name: "escada: oito passos automaticos numa hora disparam, tres nao, e os humanos nao contam"
    # Longe do limiar dos dois lados: o `increase` extrapola para as pontas da
    # janela, e um ensaio a 5 contra 6 media a extrapolacao e nao a regra.
    input_series:
      - series: 'ts_sancoes_total{job="onboarding_lote",instance="onboarding-lote:3014",passo="aviso",origem="automatica"}'
        values: '0x10 3x60'
      - series: 'ts_sancoes_total{job="onboarding_lote",instance="onboarding-lote:3014",passo="limitacao",origem="automatica"}'
        values: '0x40 5x40'
      - series: 'ts_sancoes_total{job="onboarding_lote",instance="onboarding-lote:3014",passo="suspensao",origem="humana"}'
        values: '0x10 9x60'
    alert_rule_test:
      # Aos 30 min: 3 avisos; as 9 suspensoes humanas nao contam.
      - eval_time: 30m
        alertname: ts_escada_automatica_acima_do_ritmo
        exp_alerts: []
      # Aos 45 min: 3 avisos e 5 limitacoes.
      - eval_time: 45m
        alertname: ts_escada_automatica_acima_do_ritmo
        exp_alerts:
          - exp_labels:
              severity: P2
              componente: gov
            exp_annotations:
              resumo: A escada automatica de Trust & Safety deu mais de 5 passos na ultima hora.
              limite: O ritmo e proposta, sem calibracao.
              runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md

  - interval: 1m
    name: "confianca: a primeira falha do recalculo dispara, as mudancas nao, e passada a janela resolve"
    input_series:
      - series: 'confianca_recalculos_total{job="onboarding_lote",instance="onboarding-lote:3014",origem="aprovacao",desfecho="falhou"}'
        values: '0x10 1x30'
      - series: 'confianca_recalculos_total{job="onboarding_lote",instance="onboarding-lote:3014",origem="diario",desfecho="mudou"}'
        values: '0x5 7x35'
    alert_rule_test:
      # Aos 8 min so as mudancas subiram: nao dispara.
      - eval_time: 8m
        alertname: confianca_recalculo_com_falhas
        exp_alerts: []
      - eval_time: 12m
        alertname: confianca_recalculo_com_falhas
        exp_alerts:
          - exp_labels:
              severity: P2
              componente: gov
            exp_annotations:
              resumo: O recalculo da confianca gradual falhou para pelo menos um tenant.
              qual_tenant: A metrica e o registo nao levam tenant (OBS-I); os tenants sem nivel leem-se da platform.trust_level contra os casos aprovados, pelo lote.
              runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md
      - eval_time: 35m
        alertname: confianca_recalculo_com_falhas
        exp_alerts: []

  # KAM-219: a recusa da base sobre o tecto. O caso e o controlo do adversarial
  # (f): a primeira recusa dispara, e um processo sem recusas — o lote a escrever
  # o tecto como `kamba_batch`, que a base aceita — fica em silencio.
  - interval: 1m
    name: "tecto: a primeira recusa dispara, e passada a janela resolve"
    input_series:
      - series: 'tenant_guard_tecto_recusado_total{job="com",instance="com:3002"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: confianca_tecto_escrita_recusada
        exp_alerts: []
      - eval_time: 12m
        alertname: confianca_tecto_escrita_recusada
        exp_alerts:
          - exp_labels:
              severity: P2
              componente: gov
              job: com
            exp_annotations:
              resumo: A base recusou (42501) a uma transaccao da aplicacao uma operacao sobre platform.trust_level.
              qual_tenant: Nao se le desta serie (OBS-I); o job diz o processo, e o runbook diz onde procurar.
              runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md
      - eval_time: 35m
        alertname: confianca_tecto_escrita_recusada
        exp_alerts: []

  - interval: 1m
    name: "tecto: o controlo, zero recusas em todos os processos, nao dispara"
    input_series:
      - series: 'tenant_guard_tecto_recusado_total{job="onboarding_lote",instance="onboarding-lote:3014"}'
        values: '0x40'
      - series: 'tenant_guard_tecto_recusado_total{job="com",instance="com:3002"}'
        values: '0x40'
      - series: 'tenant_guard_tecto_recusado_total{job="entrada",instance="worker-canal-entrada:3013"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: confianca_tecto_escrita_recusada
        exp_alerts: []
      - eval_time: 40m
        alertname: confianca_tecto_escrita_recusada
        exp_alerts: []

  - interval: 1m
    name: "tecto: um reinicio do processo (o contador volta a zero) nao dispara"
    input_series:
      - series: 'tenant_guard_tecto_recusado_total{job="onboarding_lote",instance="onboarding-lote:3014"}'
        values: '0x10 1x50 0x30'
    alert_rule_test:
      - eval_time: 63m
        alertname: confianca_tecto_escrita_recusada
        exp_alerts: []
      - eval_time: 75m
        alertname: confianca_tecto_escrita_recusada
        exp_alerts: []
