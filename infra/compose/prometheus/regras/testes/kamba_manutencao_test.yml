# O mecanismo do anuncio de uma janela de manutencao — KAM-082, criterio 6.
#
# ## O QUE ESTE FICHEIRO MEDE, E PORQUE E OUTRA PERGUNTA
#
# O `kamba_slo_burn_test.yml` mede o que a bandeira `slo_manutencao_anunciada`
# **faz** quando vale 1 (a isencao, nas suas tres condicoes). Este mede o que a
# **poe** a 1: a aritmetica de instantes com que o cabecalho do
# `../kamba-manutencao.yml` manda anunciar uma janela.
#
# Sao duas perguntas e nao uma, e separa-las tem um motivo pratico: a lista de
# producao esta **vazia** (nenhuma janela anunciada, porque nao ha producao nem
# *staging*), pelo que ela nao serve para testar o mecanismo. Carrega-se aqui a
# *fixture* `fixtures/janelas-de-exemplo.yml`, com duas janelas na forma exacta
# do template — para que quem acrescentar a primeira janela a serio **nao esteja
# a estrear a expressao**.
#
# Nao se carregam os dois ficheiros ao mesmo tempo de proposito: ambos gravam
# `slo_manutencao_anunciada`, e duas regras a gravar a mesma serie dao duas
# amostras para o mesmo instante.
#
# ## PORQUE E QUE OS INSTANTES DE CONSULTA SAO MULTIPLOS DE 30 S
#
# Uma recording rule so deixa amostra nos instantes de avaliacao. Uma consulta
# fora de um deles olha 5 min para tras; cair no vao devolve `nil`, que se le
# como «a regra esta errada» quando a regra esta certa. Medido, e custou um
# ensaio.
#
# As duas janelas da *fixture*, em segundos do epoch UTC:
#
#   janela A   2 000 - 3 800
#   janela B   10 000 - 11 800

rule_files:
  - fixtures/janelas-de-exemplo.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    name: "janela A: 1 dentro, 0 antes e 0 depois"
    input_series:
      # O `vector()` nao precisa de serie de entrada nenhuma; esta esta aqui so
      # para dar ao `promtool` uma serie que cubra o intervalo do ensaio.
      - series: 'up{job="prometheus",instance="127.0.0.1:9090"}'
        values: '1+0x500'
    promql_expr_test:
      # 1 800 s: antes do inicio (2 000).
      - expr: slo_manutencao_anunciada
        eval_time: 30m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0
      # 3 000 s: dentro.
      - expr: slo_manutencao_anunciada
        eval_time: 50m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 1
      # 3 600 s: dentro, perto do fim (3 800).
      - expr: slo_manutencao_anunciada
        eval_time: 60m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 1
      # 4 200 s: depois do fim.
      - expr: slo_manutencao_anunciada
        eval_time: 70m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0

  - interval: 30s
    name: "janela B: a segunda janela conta, e a soma nunca passa de 1"
    input_series:
      - series: 'up{job="prometheus",instance="127.0.0.1:9090"}'
        values: '1+0x500'
    promql_expr_test:
      # 9 000 s: entre as duas janelas.
      - expr: slo_manutencao_anunciada
        eval_time: 150m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0
      # 10 800 s: dentro da B.
      - expr: slo_manutencao_anunciada
        eval_time: 180m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 1
      # 12 600 s: depois da B. **O caso que importa**: se os dois termos se
      # somassem fora de sitio, isto dava 1 ou 2 e a isencao ficava ligada para
      # sempre — uma avaria que se le como «ha menos indisponibilidade».
      - expr: slo_manutencao_anunciada
        eval_time: 210m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0
      # E a invariante de que a regra de isencao depende: nunca 2.
      - expr: slo_manutencao_anunciada > 1
        eval_time: 180m
        exp_samples: []
