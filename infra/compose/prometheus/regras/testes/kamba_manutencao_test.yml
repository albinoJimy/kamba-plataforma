# O mecanismo do anuncio de uma janela de manutencao — KAM-082, criterio 6.
#
# ## O QUE ESTE FICHEIRO MEDE, E PORQUE E OUTRA PERGUNTA
#
# O `kamba_slo_burn_test.yml` mede o que a bandeira `slo_manutencao_anunciada`
# **faz** quando vale 1 (a isencao, nas suas tres condicoes). O
# `kamba_slo_producao_test.yml` mede que, nos ficheiros de **producao**, ela vale
# 0 e nada e isento. Este mede o que a **poe** a 1: a aritmetica de instantes com
# que o cabecalho do `../kamba-manutencao.yml` manda anunciar uma janela.
#
# Sao tres perguntas e nao uma, e separa-las tem um motivo pratico: a lista de
# producao esta **vazia**, pelo que ela nao serve para testar o mecanismo.
# Carrega-se aqui a *fixture* `fixtures/janelas-de-exemplo.yml`, com duas janelas
# na forma exacta do template — para que quem acrescentar a primeira janela a
# serio **nao esteja a estrear a expressao**.
#
# Nao se carregam os dois ficheiros ao mesmo tempo de proposito: ambos gravam
# `slo_manutencao_anunciada`, e duas regras a gravar a mesma serie dao duas
# amostras para o mesmo instante.
#
# ## AS FRONTEIRAS, QUE SAO O QUE ESTE FICHEIRO EXISTE PARA PRENDER
#
# A primeira versao deste ensaio consultava 30, 50, 60, 70, 150, 180 e 210 min
# sobre janelas que comecavam em 2 000 e 10 000 s — nenhum desses instantes **e**
# uma fronteira. A varredura de mutacao mostrou o preco: trocar o `>=` do inicio
# por `>` **sobrevivia**, porque o instante exacto do inicio nunca era afirmado.
#
# As janelas da *fixture* passaram para multiplos de 30 s (o intervalo de
# avaliacao), e agora as quatro fronteiras consultam-se:
#
#   janela A   1 800 s (30 min) inclusive  ->  3 600 s (60 min) exclusivo
#   janela B   9 000 s (150 min) inclusive -> 10 800 s (180 min) exclusivo
#
# ## PORQUE E QUE OS INSTANTES DE CONSULTA SAO MULTIPLOS DE 30 S
#
# Uma *recording rule* so deixa amostra nos instantes de avaliacao. Uma consulta
# fora de um deles olha 5 min para tras; cair no vao devolve `nil`, que se le
# como «a regra esta errada» quando a regra esta certa. Medido, e custou um
# ensaio.

rule_files:
  - fixtures/janelas-de-exemplo.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    name: "janela A: as duas fronteiras — inicio inclusive, fim exclusivo"
    input_series:
      # O `vector()` nao precisa de serie de entrada nenhuma; esta esta aqui so
      # para dar ao `promtool` um intervalo de tempo que cubra o ensaio.
      - series: 'up{job="prometheus",instance="127.0.0.1:9090"}'
        values: '1+0x500'
    promql_expr_test:
      # 1 770 s: a ultima avaliacao **antes** do inicio.
      - expr: slo_manutencao_anunciada
        eval_time: 29m30s
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0
      # 1 800 s: o inicio, **inclusive**. E o instante que mata a mutacao
      # `>= bool 1800` -> `> bool 1800`.
      - expr: slo_manutencao_anunciada
        eval_time: 30m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 1
      # 3 570 s: a ultima avaliacao **dentro** da janela.
      - expr: slo_manutencao_anunciada
        eval_time: 59m30s
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 1
      # 3 600 s: o fim, **exclusivo**. Mata `< bool 3600` -> `<= bool 3600`.
      - expr: slo_manutencao_anunciada
        eval_time: 60m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0

  - interval: 30s
    name: "janela B: a segunda janela conta, e a soma nunca passa de 1"
    input_series:
      - series: 'up{job="prometheus",instance="127.0.0.1:9090"}'
        values: '1+0x500'
    promql_expr_test:
      # 7 200 s: entre as duas janelas.
      - expr: slo_manutencao_anunciada
        eval_time: 120m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0
      # 9 000 s: o inicio da B, inclusive.
      - expr: slo_manutencao_anunciada
        eval_time: 150m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 1
      # 10 800 s: o fim da B, exclusivo. **O caso que importa mais**: se os dois
      # termos se somassem fora de sitio, isto dava 1 ou 2 e a isencao ficava
      # ligada para sempre — uma avaria que se le como «ha menos
      # indisponibilidade».
      - expr: slo_manutencao_anunciada
        eval_time: 180m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0
      - expr: slo_manutencao_anunciada
        eval_time: 210m
        exp_samples:
          - labels: 'slo_manutencao_anunciada'
            value: 0
      # E a invariante de que a regra de isencao depende: nunca 2.
      - expr: slo_manutencao_anunciada > 1
        eval_time: 150m
        exp_samples: []
