# FIXTURE — **nao e uma regra de producao**, e nao vive na pasta das regras.
#
# Duas janelas de manutencao de exemplo, na forma que o cabecalho do
# `../../kamba-manutencao.yml` manda usar para anunciar uma janela a serio. Esta
# aqui, e nao ali, por duas razoes:
#
#   1. a lista de producao esta **vazia**, porque nenhuma janela foi anunciada —
#      nao ha producao nem *staging* a correr. Por uma data inventada em
#      producao nao se paga nada em troca de nada;
#   2. o `tools/obs_lint` le `infra/compose/prometheus/regras/*.yml` como
#      superficie de producao (nao recursivamente), pelo que um ficheiro de
#      regras de exemplo naquela pasta era lido como regra real.
#
# As duas janelas, em segundos do epoch UTC:
#
#   janela A   1 800 - 3 600     (1 800 s = 30 min)
#   janela B   9 000 - 10 800    (1 800 s = 30 min)
#
# Nao se sobrepoem, pelo que a soma dos dois termos e 0 ou 1 e nunca 2 — que e a
# invariante de que a regra de isencao do `kamba-slo.yml` depende (ela compara
# `slo_manutencao_anunciada == 1`).
#
# ## PORQUE E QUE OS QUATRO INSTANTES SAO MULTIPLOS DE 30 S
#
# Para que as **fronteiras** se possam consultar. Uma *recording rule* so deixa
# amostra nos instantes de avaliacao (aqui 30 s), pelo que uma fronteira que
# caia no vao entre dois nunca e afirmada — e a primeira versao desta *fixture*
# usava 2 000 e 3 800, que nao sao multiplos de 30: a varredura de mutacao
# mostrou que trocar o `>=` por `>` no inicio **sobrevivia**, porque nenhum
# ensaio consultava o instante exacto do inicio.
#
# Com as fronteiras na grelha, o `kamba_manutencao_test.yml` consulta-as:
# 1 800 s tem de dar **1** (inicio **inclusive**) e 3 600 s tem de dar **0**
# (fim **exclusivo**).

groups:
  - name: janelas-de-exemplo
    interval: 30s
    rules:
      - record: slo_manutencao_anunciada
        expr: 'vector(((time() >= bool 1800) * (time() < bool 3600)) + ((time() >= bool 9000) * (time() < bool 10800)))'
