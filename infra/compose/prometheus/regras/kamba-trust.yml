# Regras de alerta de Trust & Safety — KAM-200, criterio 3; a do recalculo
# da confianca gradual, que corre no mesmo processo — KAM-203; e as duas da
# recusa da base sobre o tecto — KAM-219, vista pelo `tenant_guard`, e KAM-225,
# lida do registo do PostgreSQL.
#
# Validado por `make obs-promtool`: `promtool check rules` (sintaxe) e
# `promtool test rules` (comportamento, em `testes/kamba_trust_test.yml`).
#
# **Ficheiro proprio, e nao duas regras no `kamba.yml`**, porque a prosa daquele
# conta as suas regras («8 regras neste ficheiro») e o `docs/observabilidade.md`
# cita a mesma contagem. Duas regras la dentro tornavam falsas tres frases que
# nenhum linter le.
#
# ## As series
#
# `ts_sancoes_total{passo,origem}`, do `packages/core-ts/src/trust/metricas.ts`,
# servida pelo processo de lote do onboarding (`onboarding_lote` no
# `prometheus.yml`), onde correm o consumidor, as varreduras e as decisoes da
# fila. **Nasce a zero** em todo o dominio, pelo que o `increase` ve a primeira
# ocorrencia sem o remedio do cabecalho do `kamba.yml` («serie que nasce a 1 nao
# e serie que subiu»); o ensaio mede-o.
#
# **Sem tenant** (`OBS-I`): qual loja foi suspensa le-se da `ts_sanction`, por
# quem tem papel para isso. O runbook diz como.
#
# ## Os dois numeros sao *proposta*
#
# A janela de 10 min da suspensao e o ritmo de 5 passos automaticos por hora da
# escada nao foram calibrados: nao ha Piloto. A calibracao e a da politica de
# risco (`POLITICA_DE_RISCO`, critério de saida do EPIC-09).

groups:
  - name: kamba-trust
    interval: 30s
    rules:
      # Uma suspensao ou um encerramento decididos por um revisor: os dois
      # suspendem a loja (o encerramento so passa a `encerrado` no fim do prazo do
      # recurso). P3 e nao mais: a decisao ja foi humana e com MFA, e o alerta
      # existe para que a equipa saiba, nao para a reverter. **Conta a decisao, e
      # nao a transicao**: dispara tambem sobre uma loja que ja estava suspensa
      # (pela regua, por exemplo), e o runbook diz como o distinguir.
      - alert: ts_suspensao_decidida
        expr: 'increase(ts_sancoes_total{passo=~"suspensao|encerramento"}[10m]) > 0'
        for: 0m
        labels:
          severity: P3
          componente: gov
        annotations:
          resumo: Trust & Safety decidiu suspender ou encerrar uma loja.
          qual_tenant: Le-se da platform.ts_sanction pelo lote; a metrica nao leva tenant (OBS-I).
          runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md

      # A escada automatica (aviso e limitacao) a subir acima de um ritmo: ou ha
      # um ataque em curso, ou a politica de risco esta mal calibrada e esta a
      # limitar lojas honestas. As duas pedem um humano a olhar.
      - alert: ts_escada_automatica_acima_do_ritmo
        expr: 'sum(increase(ts_sancoes_total{origem="automatica"}[1h])) > 5'
        for: 0m
        labels:
          severity: P2
          componente: gov
        annotations:
          resumo: A escada automatica de Trust & Safety deu mais de 5 passos na ultima hora.
          limite: O ritmo e proposta, sem calibracao.
          runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md

      # KAM-203: o recalculo da confianca gradual falhou para pelo menos um
      # tenant. Os dois lados custam: um tenant aprovado que nao nasce no nivel 0
      # nao cobra (o trigger da cobranca recusa sem nivel, KAM-096), e um que nao
      # desce fica com o tecto do nivel 1 depois de uma sancao. A volta diaria
      # repara, mas so no dia seguinte, e por isso e P2 e nao P3. A janela de 15
      # min e *proposta*: a varredura das descidas corre a cada minuto.
      - alert: confianca_recalculo_com_falhas
        expr: 'sum(increase(confianca_recalculos_total{desfecho="falhou"}[15m])) > 0'
        for: 0m
        labels:
          severity: P2
          componente: gov
        annotations:
          resumo: O recalculo da confianca gradual falhou para pelo menos um tenant.
          qual_tenant: A metrica e o registo nao levam tenant (OBS-I); os tenants sem nivel leem-se da platform.trust_level contra os casos aprovados, pelo lote.
          runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md

      # KAM-219: a base recusou (42501) uma escrita ou a leitura do motivo em
      # `platform.trust_level` a uma transaccao da aplicacao. So o `kamba_batch`
      # escreve o tecto (KAM-096), e nenhum codigo da aplicacao o tenta: uma
      # recusa e codigo a tentar mudar um tecto por um caminho que nao devia
      # existir (uma injeccao, um defeito novo), ou um defeito de privilegio do
      # proprio lote sobre o tecto. As duas pedem quem olhe ja. P2 e a janela de
      # 10 min sao *proposta*.
      #
      # **Dispara na primeira, e por dois ramos.** O `increase` ve o 0 -> 1 de
      # uma serie que nasce a zero; mas uma recusa **antes** do primeiro *scrape*
      # (o lote corre a volta diaria logo no arranque) faz a primeira amostra
      # ja valer 1, e o `increase` nao a ve. O segundo ramo apanha esse caso: a
      # serie acima de zero num `job` que nao tinha serie 10 min antes (um
      # processo que acabou de nascer). **O que fica de fora:** um reinicio em
      # menos de 5 min (o *lookback*) de um processo que ja tinha recusas, que
      # volta a recusar antes do primeiro *scrape* — 1 -> 1 nao e subida.
      #
      # **So ve o que passa pelo `comTenant`/`comBatch`** de um processo
      # TypeScript que a sirva (`packages/core-ts/src/tenant_guard/metricas.ts`);
      # uma ligacao directa, um processo Python ou uma transaccao aberta a mao
      # nao chegam aqui, e o bloco do KAM-219 diz o credor.
      - alert: confianca_tecto_escrita_recusada
        expr: 'sum by (job) (increase(tenant_guard_tecto_recusado_total[10m])) > 0 or (sum by (job) (tenant_guard_tecto_recusado_total) > 0 unless sum by (job) (tenant_guard_tecto_recusado_total offset 10m))'
        for: 0m
        labels:
          severity: P2
          componente: gov
        annotations:
          resumo: A base recusou (42501) a uma transaccao da aplicacao uma operacao sobre platform.trust_level.
          qual_tenant: Nao se le desta serie (OBS-I); o job diz o processo, e o runbook diz onde procurar.
          runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md

      # KAM-225: a mesma recusa, lida do **registo do PostgreSQL** pelo
      # `registo-pg` (`libs/py-core/src/kamba_core/registo_pg/`). Ve o que a de
      # cima nao ve — uma ligacao directa com a credencial do `kamba_app`, um
      # processo Python, uma consulta solta num *pool* — e nao conta o
      # `kamba_batch` (o criterio 1 do KAM-225 pede a recusa «por um papel que
      # nao e o `kamba_batch`»). **As duas regras coexistem de proposito:** uma
      # recusa pelo `comTenant` dispara as duas, e a de cima diz que processo a
      # recebeu, o que o registo nao diz. P2 e a janela de 10 min sao os da de
      # cima, *proposta*.
      #
      # **Os mesmos dois ramos.** O recolector nasce a zero e comeca no fim do
      # registo — um reinicio nao reconta, e o `increase` le a descida como
      # reinicio —, mas uma recusa antes do primeiro *scrape* faz a primeira
      # amostra valer 1, e e o segundo ramo que a apanha. **Fica de fora**: uma
      # recusa escrita enquanto o recolector esta em baixo (o `alvo_em_baixo`
      # do `kamba.yml` ve o processo parado — o alvo e fixo no `prometheus.yml`
      # para isso —, nao a recusa perdida), e uma recusa que um bloco PL/pgSQL
      # apanha com `EXCEPTION`, que o servidor nao escreve no registo.
      #
      # **Um falso positivo, herdado da regra de cima:** um buraco de raspagem de
      # 10 min ou mais faz o segundo ramo ver de novo uma serie acima de zero sem
      # serie 10 min antes, e a regra volta a disparar sobre uma recusa antiga
      # (medido com o `promtool` na revisao adversarial do KAM-225; a de cima faz
      # o mesmo). O runbook manda confirmar no registo antes de tratar o alerta.
      - alert: confianca_tecto_recusado_no_registo
        expr: 'sum by (job) (increase(registo_pg_tecto_recusado_total[10m])) > 0 or (sum by (job) (registo_pg_tecto_recusado_total) > 0 unless sum by (job) (registo_pg_tecto_recusado_total offset 10m))'
        for: 0m
        labels:
          severity: P2
          componente: gov
        annotations:
          resumo: O registo do PostgreSQL tem uma recusa (42501) sobre platform.trust_level a um papel que nao e o kamba_batch.
          qual_tenant: Nao se le desta serie (OBS-I); o registo do servidor diz o papel e a hora, e o runbook diz onde procurar.
          runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md

      # KAM-225: o recolector deixou de ver o registo. Com o servidor de pe e o
      # `jsonlog` ligado, a rotacao por tempo cria ou trunca o ficheiro de cada
      # hora mesmo sem nada para escrever (medido), pelo que a idade do mais novo
      # fica abaixo de uma hora. Acima de duas, o servidor deixou de escrever o
      # `jsonlog` — o `postgres` recriado sem o `command:`, a configuracao mudada
      # —, e a regra de cima esta cega com o `/healthz` a 200. Achado da revisao
      # adversarial do KAM-225. As duas horas e o P2 sao *proposta*. Um servidor
      # parado tambem a faz disparar, ao lado dos alertas dele.
      - alert: registo_pg_registo_parado
        expr: 'max by (job) (registo_pg_idade_do_registo_segundos) > 7200'
        for: 5m
        labels:
          severity: P2
          componente: gov
        annotations:
          resumo: O registo do PostgreSQL nao muda ha mais de duas horas; a recusa sobre o tecto deixou de se ver.
          qual_tenant: Nao se aplica; e o registo do servidor, e nao um tenant.
          runbook_url: https://github.com/albinoJimy/kamba-plataforma/blob/main/docs/runbooks/trust-e-safety.md
