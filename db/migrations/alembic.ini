# Configuracao do Alembic (KAM-003).
#
# Nao ha URL aqui, de proposito: a ligacao vem do ambiente, pelo `env.py`, e
# contem uma palavra-passe. Um `sqlalchemy.url` neste ficheiro era um segredo
# no repositorio a espera de acontecer.
#
# Uso (a partir de `db/`):
#     python -m alembic -c migrations/alembic.ini upgrade head
#     python -m alembic -c migrations/alembic.ini downgrade base

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
# Uma revisao por PR (`docs/tecnica/03` §11). O nome do ficheiro comeca pelo
# numero da revisao para que a ordem se leia no directorio.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
