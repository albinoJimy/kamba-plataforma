# registry/servicos.yaml — a vertical Servicos, persona Rececionista (KAM-027)
#
# A PRIMEIRA FORMA dos ficheiros de `registry/` (chave de topo `id`). A forma e
# a de `docs/tecnica/02` §5.1; as razoes comuns as duas verticais — a chave de
# limite em `_minor`, os dois eventos de pagamento, o `graph` e o processo que o
# serve (KAM-186) — estao escritas em `registry/vendedor.yaml` e nao se repetem
# aqui.
#
# O que e proprio desta vertical: ela e a OUTRA METADE DA REGRA DE DOIS
# (ADR-012). O gate da Fase 0 (`docs/tecnica/00` §13.2, KAM-108) pede que um
# evento produzido por uma vertical seja consumido pelo handler da outra sem
# alteracao do bus: um pedido do Vendedor pago via `ManualProvider` emite
# `payment.manual_confirmed`, e e ESTA vertical que o consome e confirma uma
# marcacao com sinal (dicionario §3.5, «Evento do gate da Fase 0»). E por isso
# que os dois eventos de pagamento estao aqui e nao sao decoracao.
#
# O §5.1 nao da a esta vertical `tom` nem `guardrails`, e nao se inventam: um
# `handoff_triggers` escrito aqui por simetria passava a ser citado como
# decisao. Entram com o KAM-035, que escreve o grafo, ou com o KAM-033, que
# escreve o `compose`.

id: servicos
# O SemVer do REGISTO desta vertical, e nao o do grafo. Sao duas linhas de
# versao e nao uma: esta sobe quando o tuplo do §5.1 muda (persona, tools,
# entitlements, subscricoes, modelos), e a do grafo
# (`verticais/servicos/arestas.py`, `VERSAO_DO_GRAFO`) sobe quando um no entra
# ou sai. O DoD do KAM-035 pede «SemVer do grafo **e** de `servicos.yaml`», e e
# por isso que sao duas.
#
# **1.1.0 e nao 1.0.1**: o KAM-035 nao muda nenhuma chave deste ficheiro — o
# `graph` ja apontava para ca e as tools ja estavam declaradas —, e o que muda e
# que o alvo **resolve**. Uma vertical cujo `graph` passa de nao resolvivel a
# resolvivel e uma capacidade nova no tuplo, que e *minor*; nao e *major* porque
# nenhum consumidor deste registo tem de mudar.
#
# **1.2.0, KAM-039**: o `notifica` das subscricoes e chave nova no tuplo, pela
# razao escrita no `registry/vendedor.yaml`.
version: 1.2.0
phase: P
persona:
  nome: "Rececionista"
  idioma: pt
  apresentacao: "Sou o assistente automatico de {loja}. Posso tratar de marcacoes e informacoes."
graph: kamba_agr.verticais.servicos:build_graph
tools:
  - list_services
  - get_availability
  - book_slot
  - cancel_booking
  - reschedule_booking
  - get_store_info
entitlements:
  modulo: servicos
  limites:
    - msgs_ai_mes
    - marcacoes_mes
# O `notifica` diz a quem (KAM-039). A razao por extenso esta em
# `registry/vendedor.yaml` e nao se repete; o que e proprio desta vertical e o
# que vem a seguir.
#
# OS DOIS EVENTOS DE PAGAMENTO NAO LEVAM `notifica`, E ISSO NAO E ESQUECIMENTO.
#
# O tuplo vazio diz «esta vertical subscreve e nao avisa ninguem», que e o
# estado verdadeiro: o `03` §12 e o dicionario §3.5 dizem o que ela tem de fazer
# com eles — «confirma uma marcacao com sinal» —, e isso **nao e uma
# notificacao**. A accao esta escrita desde o **KAM-184**, no
# `ACCOES_DE_MARCACAO` do `eventos/handlers.py`, e e ela que deixa o arranque
# aceitar estas duas: uma subscricao sem destinatario, sem accao escrita **e**
# sem credor reprova o arranque (`exigir_handlers`). O desfecho do consumo e o
# da accao e nao `sem_accao`; o que ele era — e o credor `KAM-047` que o
# acompanhava — esta na seccao de verificacao daquele bloco.
#
# **A marcacao nao vem no evento, e nao e por omissao dos esquemas**: os quatro
# contratos dos dois tipos tem `additionalProperties: false` e nao admitem
# `booking_id`. Quem resolve a encomenda para uma marcacao e a agenda, atras da
# `PortaDeMarcacao`, e as duas rotas para la chegar estao **devolvidas ao
# fundador** no criterio 1 do KAM-184.
#
# **O numero destas subscricoes nao mudou**, e e por isso que a `version` acima
# tambem nao: o tuplo das `subscriptions` e o mesmo, com os mesmos quatro pares
# e os mesmos `notifica`. O que mudou foi o que o AGR faz com dois deles, que nao
# e chave deste ficheiro.
subscriptions:
  - tipo: booking.created
    versao: 1
    notifica:
      - cliente
  - tipo: booking.reminder_due
    versao: 1
    notifica:
      - cliente
  - tipo: payment.confirmed
    versao: 1
  - tipo: payment.manual_confirmed
    versao: 1
models:
  router: kamba-router
  chat: kamba-chat
golden:
  dataset: "golden/servicos/v1"
