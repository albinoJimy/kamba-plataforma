  # --- Pseudonimizacao ----------------------------------------------------
  - id: pepper_contact_hmac
    fonte_08_5: "Pepper do HMAC de contactos"
    descricao: "segredo do contact_hmac = HMAC-SHA256(pepper_kid, E.164)"
    owner: privacidade
    rotacao_dias: 365
    rotacao_gatilho: incidente
    ambientes: [dev, staging, prod]
    obrigatorio_em: [dev, staging, prod]
    consumidores: [CHR, DAT]
    instancias: nenhuma
    anel: true
    kid: true
    nota: "o espaco de numeros moveis angolanos e da ordem de 10^8: um HMAC sem segredo e reversivel por enumeracao (doc 08 §7.2). Logo o pepper nunca vive na base de dados, tem kid, e a rotacao traz um job de re-chaveamento (KAM-072) — que e a razao do anel. Desde o KAM-008: valor na forma <kid>:<base64 de 32 octetos>, e a mensagem do HMAC leva o tipo e o tenant_id alem do valor (docs/identidade.md §3) — a `descricao` acima e a formula do doc 08, nao a que o codigo usa"

