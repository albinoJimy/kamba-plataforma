  # --- Inscricao self-service: registo, OTP e anti-abuso (KAM-086) --------
  #
  # DOIS segredos, e a divisao e por PROPRIEDADE DE SEGURANCA e nao por campo:
  # um pseudonimiza (transforma um identificador num nome estavel que nao e o
  # valor) e o outro torna infalsificavel o que entregamos a um cliente e
  # voltamos a receber dele. Donos diferentes, ritmos de rotacao diferentes.
  #
  # Dentro de cada um, os campos separam-se por SEPARADOR DE DOMINIO e nao por
  # chave nova — e o argumento escrito na nota da pepper_sms_destino, levado ao
  # caso em que os dominios sao campos do mesmo registo: a separacao sai da
  # chave quando os sistemas sao diferentes, e sai do separador quando o dono, a
  # retencao e o ciclo de rotacao sao os mesmos. Cinco chaves para cinco colunas
  # da mesma linha eram cinco rotacoes para coordenar.
  #
  # A pepper_sms_destino NAO e nenhum destes: ela cunha o ENDERECO do SMS e e do
  # KAM-116. O packages/core-ts/src/inscricao/provedores.ts e o unico sitio onde
  # os dois espacos se tocam.
  - id: pepper_onboarding_ident
    fonte_08_5: "-"
    introduzido_por: KAM-086
    descricao: "pepper de HMAC dos identificadores da inscricao: NIF, telefone, codigo de OTP, dispositivo e prefixo de rede, cada um com separador de dominio proprio"
    owner: privacidade
    rotacao_dias: 365
    rotacao_gatilho: incidente
    ambientes: [dev, staging, prod]
    obrigatorio_em: []
    consumidores: [TEN]
    instancias: nenhuma
    anel: true
    kid: false
    nota: "CINCO DOMINIOS E UMA CHAVE, e os dominios sao kamba/onboarding/{nif,telefone,otp,dispositivo,rede}/v1 seguidos do octeto nulo. O anel NAO e conveniencia: o nif_hmac vive numa coluna com indice unico (o DDL do bloco KAM-086), e sem anel uma rotacao fazia o indice deixar de ver os duplicados que ja la estavam — o hmacCorresponde prova as duas chaves, em tempo constante e sem sair ao primeiro acerto. kid: FALSE pela razao da pepper_sms_destino: o valor e base64 PADRAO de 32 octetos e nao <kid>:<base64>, e base64url e RECUSADO porque o Buffer.from aceita os dois e devolve os mesmos octetos — o mesmo segredo escrito de duas maneiras era o mesmo segredo com duas grafias. O HMAC DO OTP esta aqui e nao a parte: ele vive cinco minutos e e verificador de um espaco de seis algarismos, pelo que o que o protege e a chave ser secreta e nao a chave ser outra; um separador proprio mantem o espaco disjunto do do telefone. A rotacao de 365 dias e proposta, por analogia com a pepper_contact_hmac. obrigatorio_em VAZIO porque so o onboarding-web liga o modulo, e exigi-lo ao arranque travava servicos que nao fazem registo nenhum; em CI e dev usa-se uma chave de ensaio montada no proprio ensaio"
  - id: segredo_onboarding_assinatura
    fonte_08_5: "-"
    introduzido_por: KAM-086
    descricao: "chave de HMAC do token de convite de /entrar, do bilhete de OTP, do cookie de sessao do caso e do desafio da prova de trabalho"
    owner: seguranca
    rotacao_dias: 182
    rotacao_gatilho: incidente
    ambientes: [dev, staging, prod]
    obrigatorio_em: []
    consumidores: [TEN, GOV]
    instancias: nenhuma
    anel: true
    kid: false
    nota: "QUATRO DOMINIOS E UMA CHAVE: kamba/onboarding/{entrar,ticket,sessao,pow}/v1. A separacao entre o `ticket` e a `sessao` NAO e cosmetica e e a barreira central deste ticket: no caminho de recuperacao do criterio 8 o bilhete e entregue a QUEM SUBMETEU o formulario, que pode nao ser o dono do numero; se o bilhete servisse de cookie, bastava po-lo no navegador e a prova de posse do telefone deixava de ser condicao de entrada. O anel pela razao do KAM-013: um convite impresso num anuncio ou mandado por um contabilista vive semanas, e um dono a meio do registo nao pode ser expulso por uma rotacao — o verificarToken e o lerReferencia aceitam as duas chaves, em tempo constante e sem sair ao primeiro acerto. SEM kid na carga de proposito: ele dizia a quem recebe qual das chaves assinou, que e informacao sobre o estado da rotacao, e o anel de duas resolve a leitura sem ela. A rotacao de 182 dias e proposta: e mais curta do que a do pepper porque uma fuga desta chave e a emissao de convites e de sessoes por terceiros, ao passo que uma fuga do pepper e a reversao de pseudonimos — o primeiro e um acesso, o segundo e uma exposicao. obrigatorio_em vazio pela razao da entrada acima"
