    fonte_08_5: "-"
    introduzido_por: KAM-008
    descricao: "chave que embrulha a DEK de cada contacto (AES-256-GCM); a DEK cifra bsuid_enc e phone_enc"
    owner: privacidade
    rotacao_dias: 365
    rotacao_gatilho: incidente
    ambientes: [dev, staging, prod]
    obrigatorio_em: []
    consumidores: [CHR]
    instancias: nenhuma
    anel: true
    kid: true
    nota: "o doc 08 §5 nao tem linha para ela: descreve a KEK dos tokens de cliente (kek_token_cliente) e nao a das DEK de contacto, que nascem com o apagamento selectivo do doc 06 §7.6. Valor na forma <kid>:<base64 de 32 octetos>; o kid fica em contact_deks.kek_id. O anel deixa abrir as DEK embrulhadas com a versao anterior; NAO ha funcao de reembrulho (docs/identidade.md §8, ponto 11): a segunda rotacao sem reembrulhar torna ilegiveis as DEK da versao mais antiga. A rotacao (365 dias) e proposta, por analogia com kek_token_cliente. LIMITE: a DEK embrulhada vive na base e nas suas copias de seguranca; destrui-la na base so torna a cifra ilegivel nas copias quando esta KEK rodar ou as copias expirarem (docs/identidade.md §8)"

  - id: kek_contacto_dono
    fonte_08_5: "-"
    introduzido_por: KAM-115
    descricao: "chave que deriva a DEK por tenant do endereco alternativo do dono (AES-256-GCM); a DEK cifra owner_contacts.endereco_enc"
    owner: privacidade
    rotacao_dias: 365
    rotacao_gatilho: incidente
    ambientes: [dev, staging, prod]
    obrigatorio_em: []
    consumidores: [CHR, HND]
    instancias: nenhuma
    anel: true
    kid: true
    nota: "o doc 08 §5 nao tem linha para ela, como nao tem para a kek_contact_dek: nasce com o aviso ao dono por canal alternativo (doc 01 §14, doc 10 §6.4). Valor na forma <kid>:<base64 de 32 octetos>; o kid vai **dentro** do criptograma, pelo que a rotacao nao torna ilegivel o que ja esta escrito — e a forma do cifra.ts do KAM-016 e nao a do KAM-008, porque aqui a DEK e **derivada** por HKDF e nao guardada numa tabela: um endereco de dono e re-cunhavel (o dono volta a dar-lho) e uma tabela de DEK nova com tenant_id que a suite nao saiba semear falha o gate 6. **KEK separada da kek_token_cliente de proposito**: duas KEK dao duas DEK para o mesmo tenant, pelo que uma cifra de token de cliente nao abre como endereco e vice-versa — a separacao de dominio sai da chave e nao de uma constante que alguem pode esquecer de mudar. LIMITE: o endereco em claro existe entre a decifra e a entrega ao fornecedor de e-mail, que e um subprocessador (KAM-069) e o guarda nos registos de entrega dele; o gate de prod do fornecedor.ts recusa o arranque sem apd_ref (ADR-008)"

  - id: sujeito_epoch_key
    fonte_08_5: "-"
    introduzido_por: KAM-008
    descricao: "chave mensal do pseudonimo analitico: sujeito_ref = trunc16(HMAC-SHA256(K_epoca, contact_id))"
    owner: privacidade
    rotacao_dias: 30
    rotacao_gatilho: incidente
    ambientes: [dev, staging, prod]
    obrigatorio_em: []
    consumidores: [CHR, DAT]
    instancias: epoca
    anel: false
    kid: false
    nota: "uma chave por mes (a instancia e YYYYMM, em UTC), de 32 octetos em base64. O doc 06 §7.2 manda guarda-la no cofre e destrui-la ao fim da retencao (12 meses, proposta): por isso nao se deriva de uma chave-mestra, que a deixava recalcular. Uma epoca sem chave e uma epoca cujo pseudonimo ja nao se calcula. Quem cria a chave de cada mes e quem a destroi nao esta atribuido a ticket nenhum (docs/identidade.md §8)"

