    ambientes: [dev, staging, prod]
    obrigatorio_em: [dev, staging, prod]
    consumidores: [AGR, HND]
    instancias: nenhuma
    anel: false
    kid: false
    nota: "o doc 08 §5 nao tem linha para ela: as rotas /internal/turn e /internal/resume nascem com o KAM-025. Dois consumidores e nao um — o AGR **verifica** e quem chama **apresenta**: o shim da fila agr-inbound (ADR-L004, Decisao 1) e o HND, que faz o POST /internal/resume da retoma do handoff (docs/tecnica/02 §11 regra 3). `obrigatorio_em` nos tres ambientes, incluindo dev: uma rota que corre um turno sem credencial em dev e uma rota que alguem esquece de proteger em prod, e o Secrets.arrancar e que o impede. Sem anel: a comparacao e em tempo constante contra **um** valor (hmac.compare_digest), e um anel obrigava a comparar contra dois — o que duplica a superficie de um segredo que roda sem corte de servico, porque o shim repete o job. A rotacao de 90 dias e proposta, por analogia com as outras credenciais de servico-para-servico deste inventario"

