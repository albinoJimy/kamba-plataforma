    nota: "O doc 08 §5 nao tem linha para ela: a tabela cobre credenciais de BD, chaves de provedor e o cofre, e nao o repositorio de backup, que nasce com o doc 09 §8.1. SEM ELA O BACKUP E INUTIL, e e por isso que esta entrada existe antes de haver repositorio: o §8.1 escreve «copia offline da chave de cifra (sem ela o backup e inutil)», e um segredo sem registo nao tem quem lhe guarde essa copia. O procedimento da copia offline e o KAM-083 (runbooks). `anel: false` com uma consequencia que se diz em voz alta: rodar esta passphrase NAO re-cifra os backups existentes — o pgBackRest cifra por repositorio, pelo que a rotacao exige um repositorio novo e um completo novo, e os backups antigos continuam a precisar da passphrase antiga. Por isso a rotacao de 365 dias e proposta e `rotacao_gatilho: incidente` e o que manda. `obrigatorio_em` vazio porque nao ha repositorio: a configuracao do `infra/backup/` nao esta montada por nenhum compose (ver o `pgbackrest.conf`), e marca-la obrigatoria em prod impedia a pilha de arrancar por um segredo que nada le. Entra em `obrigatorio_em` com o ticket que trouxer o repo1 (D1/KAM-105)"

