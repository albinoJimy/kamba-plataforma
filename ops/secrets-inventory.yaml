# Inventario de segredos da KAMBÁ — KAM-010
#
# Fonte: docs/tecnica/08_Seguranca_Conformidade.md §5 (tabela de segredos e
# chaves). **Toda a linha dessa tabela tem de estar coberta por pelo menos uma
# entrada aqui**, e e isso que `tools/secrets_inventory` mede: nao e uma
# intencao, e um teste que falha.
#
# O inverso nao e verdade: ha entradas aqui que a tabela do doc 08 nao tem como
# linha propria, porque a tabela agrupa (uma linha para "credenciais de BD", tres
# papeis distintos; uma linha para "chaves dos provedores LLM/STT e LiteLLM",
# quatro segredos diferentes). Essas entradas dizem a que linha pertencem em
# `fonte_08_5`, e as que nao pertencem a nenhuma declaram `introduzido_por`.
#
# ESTADO: **proposta**. O que vem do doc 08 §5 herda o estado dele. O que este
# ticket acrescentou — os `owner`, a traducao de "semestral" em dias, a lista de
# `consumidores`, os `ambientes` e os `obrigatorio_em` — e desenho ainda nao
# ratificado: ver `estado_dos_campos` em baixo.
#
# NAO HA VALORES NESTE FICHEIRO, e nunca havera. Um inventario diz que segredos
# existem, quem os detem e quando rodam. Os valores vivem no cofre (Doppler no
# Piloto, OpenBao nos Clusters — doc 08 §5) e chegam ao processo pelo mecanismo
# do `docs/adr/ADR-L002-injeccao-de-segredos.md`.

versao: 1
ticket: KAM-010
estado: proposta
fonte: "docs/tecnica/08_Seguranca_Conformidade.md §5"
actualizado_em: "2026-10-24"

# Como ler os campos, e qual deles e que ainda nao esta ratificado.
#
#   id              nome canonico do segredo; e tambem a referencia (`SecretRef`)
#                   com que o codigo o pede. snake_case, de `specs/02` §3.9.
#   fonte_08_5      a linha da tabela do doc 08 §5 a que esta entrada pertence,
#                   verbatim. "-" quando nao pertence a nenhuma.
#   owner           papel responsavel, dos papeis de `docs/tecnica/08` §1.3.
#                   **proposta**: o doc 08 §5 nao atribui donos.
#   rotacao_dias    periodo em dias. `null` quando a rotacao e por evento e nao
#                   por calendario — e nesses casos `rotacao_gatilho` e
#                   obrigatorio. **proposta** na traducao: o doc diz "semestral"
#                   e "anual", nao 182 e 365.
#   rotacao_gatilho evento que forca rotacao fora do calendario.
#   ambientes       onde o segredo existe. **proposta** onde o doc 08 §5 nao o diz.
#   obrigatorio_em  ambientes onde a ausencia impede o arranque do consumidor.
#   consumidores    codigos do catalogo de `docs/tecnica/00` §4. Lista vazia
#                   exige `nota` que explique quem o usa.
#   instancias      `nenhuma` (um valor), `tenant`, `provedor`, `conta` ou
#                   `epoca` (o mes `YYYYMM`; KAM-008). Quando nao e `nenhuma`, a
#                   referencia leva sufixo: `id/<instancia>`.
#   anel            `true` se os consumidores aceitam `[actual, anterior]`.
#   kid             `true` se o valor e versionado por `kid` no armazenamento.

estado_dos_campos: "fonte_08_5 e rotacao herdam o doc 08 §5; owner, ambientes, obrigatorio_em, consumidores, instancias e a traducao de periodos em dias sao proposta deste ticket"

# Raizes e excepcoes da verificacao `uso` (segredo pedido pelo codigo que nao
# esta neste inventario). Ver `tools/secrets_inventory/README.md`.
analise_raizes: [services, packages, libs, tools, infra, .env.example]

analise_excluir:
  - caminho: packages/core-ts/src/secrets
    razao: "e a propria porta: serve segredos, nao os pede"
  - caminho: libs/py-core/src/kamba_core/secrets
    razao: "e a propria porta, do lado Python"
  - caminho: packages/core-ts/tests
    razao: "testa a porta; os nomes aqui sao cenarios de teste, nao pedidos de um servico"
  - caminho: libs/py-core/tests
    razao: "testa a porta, do lado Python"
  - caminho: tools/secrets_inventory
    razao: "e o verificador e as suas fixtures; verificar-se-ia a si mesmo"

