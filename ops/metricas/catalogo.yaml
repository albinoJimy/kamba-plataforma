# Catalogo de metricas da KAMBA — KAM-080
#
# **O QUE ESTE FICHEIRO E, E O QUE NAO E.**
#
# E a superficie que o `tools/obs_lint` le para verificar duas coisas: que
# nenhuma etiqueta e um identificador (criterio 3) e que nenhuma regra de alerta
# cita uma metrica que ninguem expoe (criterio 4).
#
# **Nao e o inventario das 115 metricas do repositorio.** Cobre as metricas que
# as regras de alerta e os paineis citam, mais as series que o criterio 2 nomeia
# — que e o conjunto sobre o qual o *lint* tem alguma coisa a dizer. Um
# inventario completo teria de ser gerado do codigo, e gerar do codigo exigia ler
# TypeScript; porque e que isso nao se faz aqui esta na *docstring* do
# `tools/obs_lint/lint.py`.
#
# ## A medicao que mais importa neste ficheiro
#
# Das 115 metricas declaradas no codigo, **23 estavam expostas** num `/metrics`
# de processo antes deste ticket, e em `docker compose` so **duas** superficies
# eram alcancaveis: `gwy:3010` e `com:3002`. As 44 do AGR nao tinham rota
# nenhuma — e o proprio `docs/runbooks/degradacao-do-agr.md` o dizia por escrito.
#
# A razao de tantas estarem por expor **nao e esquecimento**: os modulos
# `outbound`, `metering`, `hnd` e `qualidade` do `packages/core-ts` nao sao
# importados por nenhum servico (medido: `grep -rn "core-ts/outbound" services`
# da zero). Sao biblioteca a espera de quem as ligue. Expo-las hoje publicava
# zeros permanentes, que e o defeito que o KAM-076 recusou ao nao acrescentar um
# `scrape_config` para um `/metrics` que ainda nao existia.
#
# Por isso este ticket expoe **o AGR** (44 metricas, registo unico, servico que
# corre no compose) e deixa as outras nomeadas aqui com o credor.

version: 1

# --------------------------------------------------------------- a politica
#
# Repetida aqui em prosa para quem le o catalogo; quem a impoe e o
# `tools/obs_lint/lint.py`, e e la que ela esta em codigo.
#
# O `OBS-I` recusa **identificadores**, nao **dimensoes pequenas**. A frase e do
# dicionario §3.16, na linha da `channel_quality{rating}`: uma etiqueta de tres
# valores fechados passa onde uma de *tenant* nao passava.
#
# Duas regras, e a segunda e que torna a primeira honesta:
#
#   nome      `contact_id`, telefone e BSUID recusam-se pelo nome (criterio 3).
#             O `tenant_id` **passa pelo nome**, que e o que o criterio escreve.
#   dominio   toda a etiqueta declara lista fechada ou tecto. E aqui que o
#             `tenant_id` cai, porque o conjunto dos *tenants* nao e fechado.
#
# **A decisao sobre o `tenant_id` nao e deste ticket e nao se reabre.** As
# emendas 1.21 e 1.25 do dicionario ja a tomaram, contra criterios que pediam
# `{tenant}` por extenso, e a saida que as duas escolheram foi a mesma: **o
# por-tenant sai de consulta SQL**. O dicionario e fonte de nivel 4 e o bloco de
# um ticket e de nivel 8; onde discordam, prevalece o dicionario.

politica:
  gramatica_da_etiqueta: "^[a-z][a-z0-9_]{1,62}$"
  cardinalidade_maxima: 64

# --------------------------------------------------------------- as metricas
#
# `exposta_por` e a lista de servicos cujo `/metrics` serve esta serie **depois
# deste ticket**. Uma lista vazia quer dizer que a metrica existe em codigo e
# nenhum processo a serve — e entao nenhuma regra de alerta a pode citar, que e
# o que o *lint* verifica.

metricas:
  # ------------------------------------------------------------- GWY (3010)
  - nome: gwy_requests_total
    tipo: counter
    fonte: packages/core-ts/src/entrada/metricas.ts
    exposta_por:
      - gwy
    ajuda: Pedidos de webhook aceites pelo GWY.
    etiquetas: []

  - nome: gwy_sig_fail
    tipo: counter
    fonte: packages/core-ts/src/entrada/metricas.ts
    exposta_por:
      - gwy
    ajuda: Webhooks recusados por assinatura invalida.
    etiquetas: []

  - nome: gwy_shed_total
    tipo: counter
    fonte: packages/core-ts/src/entrada/metricas.ts
    exposta_por:
      - gwy
    ajuda: Pedidos descartados sob saturacao da fila.
    etiquetas: []

  - nome: gwy_enqueue_ms
    tipo: gauge
    fonte: packages/core-ts/src/entrada/metricas.ts
    exposta_por:
      - gwy
    ajuda: Duracao do ultimo enfileiramento, em ms. E a latencia de ingress.
    etiquetas: []

  - nome: inbound_queue_depth
    tipo: gauge
    fonte: packages/core-ts/src/entrada/metricas.ts
    exposta_por:
      - gwy
    ajuda: Profundidade da fila de entrada.
    etiquetas: []

  # -------------------------------------------------------------- COM (3002)
  - nome: com_repo_consultas_total
    tipo: counter
    fonte: services/com/src/metricas.ts
    exposta_por:
      - com
    ajuda: Consultas que passaram a barreira do repo-base, por filtro.
    etiquetas:
      - nome: filtro
        dominio:
          - tenant
          - merchant

  - nome: com_repo_filtro_em_falta_total
    tipo: counter
    fonte: services/com/src/metricas.ts
    exposta_por:
      - com
    ajuda: Consultas recusadas por nao nomearem o filtro, por filtro.
    etiquetas:
      - nome: filtro
        dominio:
          - tenant
          - merchant

  # -------------------------------------------------------------- AGR (8000)
  #
  # Expostas por este ticket. O `services/agr` ja declarava as 44 e nao tinha
  # rota; o `docs/runbooks/degradacao-do-agr.md` nomeava a falta.
  - nome: agr_turns_total
    tipo: counter
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: Turnos do agente, por desfecho.
    etiquetas:
      - nome: outcome
        cardinalidade_maxima: 16

  - nome: agr_turn_latency_ms
    tipo: gauge
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: Duracao do ultimo turno, em ms.
    etiquetas: []

  - nome: agr_queue_depth
    tipo: gauge
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: Turnos a espera na admissao.
    etiquetas: []

  - nome: agr_llm_erros_total
    tipo: counter
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: >-
      Chamadas ao LLM por desfecho. O dominio e o `RESULTADOS` do
      `llm/erros.py`, que e tambem o CHECK de `dat.llm_call_log.resultado` na
      revisao 0023.
    etiquetas:
      - nome: resultado
        dominio:
          - ok
          - ok_fallback
          - budget_exhausted
          - timeout
          - erro_fornecedor
          - destino_negado

  - nome: agr_degraded_turns_total
    tipo: counter
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: Turnos em modo deterministico, por motivo.
    etiquetas:
      - nome: motivo
        dominio:
          - timeout
          - http_429
          - budget
          - breaker
          - backpressure
          - destino_negado
          - minimizacao

  - nome: agr_degraded_acima_do_limiar_total
    tipo: counter
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: >-
      Vezes que a proporcao de turnos degradados passou o limiar na janela de 15
      min. O KAM-037 escreveu-a como «o alerta do criterio 6, na forma que esta
      casa usa», porque nao havia sistema de alertas. Este ticket da-lhe a regra.
    etiquetas: []

  - nome: agr_degraded_breaker_aberto_total
    tipo: counter
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: Vezes que o disjuntor do LLM abriu.
    etiquetas: []

  - nome: agr_handoff_total
    tipo: counter
    fonte: services/agr/src/kamba_agr/metricas.py
    exposta_por:
      - agr
    ajuda: Passagens a humano, por estado.
    etiquetas:
      - nome: estado
        cardinalidade_maxima: 16

  # --------------------------------------------------- IDX, no AGR (KAM-193)
  #
  # O modulo e o `kamba_core.idx.metricas`, e quem o serve e a `/metrics` do
  # AGR, que e onde a pesquisa corre (o executor do `search_catalog`). Os dois
  # dominios estao **por extenso** e sao os do codigo (`MODOS` e `RAMOS`); o
  # `libs/py-core/tests/test_idx_metricas.py` confronta os dois lados. O `ramo`
  # tem um valor so, `todos`, porque o `idx.candidatos` corre os tres ramos numa
  # instrucao e o processo so ve a duracao dela: a razao esta no modulo. Nenhuma
  # das tres leva o texto da pergunta, e o registo nem o recebe.
  - nome: idx_query_ms
    tipo: gauge
    fonte: libs/py-core/src/kamba_core/idx/metricas.py
    exposta_por:
      - agr
    ajuda: Duracao da ultima pesquisa no indice, em ms, por ramo e modo.
    etiquetas:
      - nome: ramo
        dominio:
          - todos
      - nome: modo
        dominio:
          - hibrido
          - lexical

  - nome: idx_results_total
    tipo: counter
    fonte: libs/py-core/src/kamba_core/idx/metricas.py
    exposta_por:
      - agr
    ajuda: Candidatos devolvidos pela pesquisa no indice, somados.
    etiquetas: []

  - nome: idx_mode
    tipo: counter
    fonte: libs/py-core/src/kamba_core/idx/metricas.py
    exposta_por:
      - agr
    ajuda: Pesquisas no indice, por modo.
    etiquetas:
      - nome: modo
        dominio:
          - hibrido
          - lexical

  # ------------------------------------------ IDX, processo proprio (KAM-194)
  #
  # A quarta do mesmo modulo, e a unica que o AGR **nao** serve: escreve-a o
  # ciclo da reindexacao, que corre no processo do IDX (`python -m
  # kamba_core.idx`, servico `idx`, porta 8061). Sem etiquetas — o ciclo soma
  # os documentos de todos os *tenants* numa volta, e o por-*tenant* sai de SQL.
  # Conta sempre, mesmo zero, a partir da primeira volta: um painel que a nao
  # visse nao distinguia «em dia» de «o ciclo nao corre».
  - nome: idx_reindexed_total
    tipo: counter
    fonte: libs/py-core/src/kamba_core/idx/metricas.py
    exposta_por:
      - idx
    ajuda: Documentos reescritos pelo ciclo da reindexacao do IDX.
    etiquetas: []

  # ---------------------------------------- ponte fila -> Python (KAM-194)
  #
  # O `ponte.ts` corre em dois servicos (um por alvo), e os dois servem a mesma
  # serie no `job` `ponte`. O `outcome` e o desfecho do *job* e nao do consumo
  # — esse mede-o o lado Python. O dominio esta por extenso e e o
  # `DESFECHOS_DA_PONTE` do modulo; nenhum `consumer`, `tenant_id` nem
  # `event_id` entra em etiqueta (`OBS-I`), pelo que e a `instance` que separa
  # a ponte do IDX da do AGR. Sai a zero nos tres valores desde o arranque.
  - nome: evt_ponte_total
    tipo: counter
    fonte: packages/core-ts/src/eventos/metricas_ponte.ts
    exposta_por:
      - worker-canal-ponte-idx
      - worker-canal-ponte-agr
    ajuda: Jobs das particoes evt.<consumer>.p<n> tratados pela ponte, por desfecho.
    etiquetas:
      - nome: outcome
        dominio:
          - entregue
          - repetir
          - recusado

  # ------------------------------------------------- backup (KAM-079)
  #
  # **As quatro tem `exposta_por` vazio, e e a declaracao que importa.** A
  # promessa escrita no topo deste ficheiro — «nenhuma regra de alerta pode
  # citar uma metrica que ninguem expoe» — e imposta pela regra
  # `metrica_sem_produtor` do `tools/obs_lint`, e e ela que faz destas quatro
  # linhas uma declaracao verificada e nao prosa: escrever a regra de alerta do
  # WAL hoje poe o *lint* vermelho.
  #
  # Estao aqui, e nao so no modulo, porque este ficheiro e onde se le o que
  # existe e quem o serve. Entram no `exposta_por` com o processo que as
  # produzir, que depende do `repo1` (D1/KAM-105).
  #
  # Nenhuma leva etiqueta de `tenant` nem de destino: um backup e do **cluster**
  # e nao de um tenant, e o nome do `repo1` e um FQDN — a localizacao do
  # repositorio de backup num painel que muita gente le.
  - nome: backup_wal_idade_segundos
    tipo: gauge
    fonte: libs/py-core/src/kamba_core/backup/metricas.py
    exposta_por: []
    ajuda: Idade do ultimo segmento de WAL arquivado, em segundos.
    etiquetas: []

  - nome: backup_restauro_desfecho_total
    tipo: counter
    fonte: libs/py-core/src/kamba_core/backup/metricas.py
    exposta_por: []
    ajuda: Restauros mensais por desfecho.
    etiquetas:
      # Dominio fechado em tres, que e o que o `OBS-I` permite. O
      # `inconclusivo` existe pela razao que o bloco do KAM-078 escreve para o
      # *smoke* da Meta: um restauro que nao correu porque o *host* descartavel
      # nao arrancou nao e um restauro falhado nem um bem-sucedido, e juntar os
      # dois casos apagava a diferenca entre «a rede de seguranca esta rota» e
      # «nao a conseguimos testar».
      - nome: desfecho
        dominio:
          - ok
          - falhado
          - inconclusivo

  - nome: backup_restauro_duracao_segundos
    tipo: gauge
    fonte: libs/py-core/src/kamba_core/backup/metricas.py
    exposta_por: []
    ajuda: Duracao do ultimo restauro completo medido, em segundos.
    etiquetas: []

  - nome: backup_restauro_debito_mbps
    tipo: gauge
    fonte: libs/py-core/src/kamba_core/backup/metricas.py
    exposta_por: []
    ajuda: Debito efectivo do ultimo restauro, em megabits por segundo.
    etiquetas: []

  # ------------------------------------------- sinteticas do Prometheus
  #
  # Nao vem de codigo nosso: o Prometheus produz uma por alvo raspado. Estao no
  # catalogo porque o painel de infra-estrutura as cita, e o *lint* exige que
  # toda a metrica citada esteja aqui — e porque sao as duas series que
  # distinguem «o processo nao arrancou» de «o processo nao contou nada», que no
  # AGR e a unica distincao que ha (o `exposicao()` dele nao emite series a
  # zero).
  #
  # O `job` e o exemplo-tipo do que o `OBS-I` permite: dimensao fechada e
  # pequena, com um valor por `scrape_config` do `prometheus.yml`.
  - nome: up
    tipo: gauge
    fonte: Prometheus (sintetica, uma por alvo)
    exposta_por:
      - prometheus
    ajuda: 1 se a ultima raspagem do alvo teve sucesso, 0 se nao.
    etiquetas:
      - nome: job
        dominio:
          - prometheus
          - gwy
          - com
          - agr
          # KAM-187: os quatro processos do `worker-canal`, um `job` cada.
          - entrada
          - agr_shim
          - publicador
          - consumidor
          # KAM-194: a ponte (dois servicos, um `job`) e o processo do IDX.
          - ponte
          - idx

  - nome: scrape_duration_seconds
    tipo: gauge
    fonte: Prometheus (sintetica, uma por alvo)
    exposta_por:
      - prometheus
    ajuda: Duracao da ultima raspagem do alvo, em segundos.
    etiquetas:
      - nome: job
        dominio:
          - prometheus
          - gwy
          - com
          - agr
          # KAM-187: os quatro processos do `worker-canal`, um `job` cada.
          - entrada
          - agr_shim
          - publicador
          - consumidor
          # KAM-194: a ponte (dois servicos, um `job`) e o processo do IDX.
          - ponte
          - idx

  # ------------------------------------------ COM / pagamentos (3013)
  #
  # KAM-055. **Sem etiqueta nenhuma**, e isso e a regra OBS-I e nao economia: o
  # `tenant_id`, o `event_id`, o `agregado_id` e o `consumer` nao entram em
  # etiqueta, e o que resta deste atraso nao tem eixo.
  - nome: com_payment_to_paid_seconds
    tipo: histogram
    fonte: services/com/src/payments/metricas.ts
    exposta_por:
      - com
    ajuda: Atraso entre o ocorrido_em do evento de pagamento e o order.paid.
    etiquetas: []

  # KAM-060. **Esta tem eixo e a de cima nao**, e a diferenca nao e descuido: o
  # `OBS-I` recusa **identificadores**, nao **dimensoes pequenas** — e a `regra`
  # e uma lista de oito valores fixos no codigo (o `REGRAS` do
  # `packages/core-ts/src/pagamentos/anomalias.ts`), ao contrario do `tenant_id`
  # e do `charge_id`, que ficam de fora dela. E a mesma leitura da
  # `channel_quality{rating}` que a politica deste ficheiro escreve.
  #
  # O dominio esta escrito **por extenso** e nao derivado: este ficheiro e lido
  # pelo `obs_lint` antes de qualquer instalacao, e o `REGRAS` e TypeScript. Um
  # nome novo entra aqui no mesmo PR que o acrescenta la, e o
  # `services/com/tests/payments.anomalias.test.ts` prende as duas listas a
  # mesma fonte do lado do codigo.
  - nome: fraud_signals_total
    tipo: counter
    fonte: services/com/src/payments/metricas.ts
    exposta_por:
      - com
    ajuda: Sinais do motor de anomalias de pagamento, por regra.
    etiquetas:
      - nome: regra
        dominio:
          - pagamento_divergente_repetido
          - hmac_invalido_em_massa
          - pagamento_orfao
          - pagamento_duplicado
          - auto_compra
          - desvio_de_confirmacoes_manuais
          - cod_sem_pagamento_repetido
          - extracto_divergente

# ------------------------------------ derivadas por recording rule (KAM-082)
#
# **Nao vem de codigo nosso nem de um `/metrics`:** o Prometheus calcula-as a
# partir das series de cima e grava-as como series novas. Estao no catalogo pela
# mesma razao que as sinteticas: o *lint* exige que toda a metrica citada por
# uma regra ou por um painel esteja aqui, e o painel do orcamento cita-as.
#
# **Porque e que os nomes levam `_` e nao `:`.** A convencao do Prometheus para
# uma recording rule e `nivel:metrica:operacao`, com dois-pontos, precisamente
# para a distinguir de uma metrica instrumentada. Aqui usam-se `_`: o
# `_metricas_citadas` do `tools/obs_lint` varre identificadores com
# `\b[a-z_][a-z0-9_]*\b`, pelo que `slo:venda:ratio` seria lido como **tres**
# nomes em falta no catalogo. O que distingue uma derivada de uma instrumentada
# e, entao, este bloco e o campo `fonte` — e nao a pontuacao do nome. Quem
# alargar o *lint* aos dois-pontos pode renomea-las; e a condicao para o fazer.
#
# O `exposta_por: [prometheus]` le-se «ha um processo que serve esta serie»: e o
# proprio Prometheus, depois de avaliar a regra. Sem isto o *lint* diria
# `metrica_sem_produtor`, e teria razao.

  - nome: slo_caminho_de_venda_bom
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: >-
      1 se todas as replicas do GWY e do AGR estavam raspaveis neste instante, 0
      se nao. E o SLI de disponibilidade do caminho de venda, e nao ve o que o
      cliente ve — isso pedia a sonda externa (credor D1/KAM-105).
    etiquetas: []

  - nome: slo_mensagens_afectadas
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: >-
      1 se houve pedidos descartados na ultima meia hora. Ve o que nos
      descartamos estando em pe, nao o que nunca chegou.
    etiquetas: []

  - nome: slo_manutencao_anunciada
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-manutencao.yml
    exposta_por:
      - prometheus
    ajuda: >-
      1 dentro de uma janela de manutencao anunciada. A lista esta vazia: nenhuma
      janela foi anunciada.
    etiquetas: []

  - nome: slo_caminho_de_venda_mau
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: >-
      1 se este instante conta como indisponibilidade para o orcamento. A amostra
      **desaparece** num instante isento pela regra das janelas (criterio 6).
    etiquetas: []

  - nome: slo_caminho_de_venda_ratio_30d
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: Disponibilidade do caminho de venda na janela de 30 dias. O SLO e 0,995.
    etiquetas: []

  - nome: slo_caminho_de_venda_orcamento_consumido
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: Fraccao do orcamento de 216 min ja gasta na janela de 30 dias. 1,0 = esgotado.
    etiquetas: []

  - nome: slo_caminho_de_venda_orcamento_restante_minutos
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: >-
      Minutos de orcamento que sobram, de 216. Fica negativo quando o orcamento
      estoura, de proposito: o excesso e o numero de que a politica dos 100%
      precisa.
    etiquetas: []

  - nome: slo_caminho_de_venda_amostras_30d
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: >-
      Quantas amostras a janela de 30 dias tem de facto. A 30 s por avaliacao uma
      janela completa tem 86 400; muito menos quer dizer que o orcamento foi
      calculado sobre menos de 30 dias — sem erro e sem outro aviso.
    etiquetas: []

  - nome: slo_caminho_de_venda_burn_1h
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: >-
      Fraccao do orcamento de 30 dias gasta na ultima hora. O limiar do alerta
      rapido e 0,02 (proposta).
    etiquetas: []

  - nome: slo_caminho_de_venda_burn_6h
    tipo: gauge
    fonte: infra/compose/prometheus/regras/kamba-slo.yml
    exposta_por:
      - prometheus
    ajuda: >-
      Fraccao do orcamento de 30 dias gasta nas ultimas 6 h. O limiar do alerta
      lento e 0,05 (proposta).
    etiquetas: []

# ------------------------------------------ as series que o criterio 2 nomeia
#
# Doze series. O `estado` de cada uma e medido, e e esta tabela que sustenta a
# caixa do criterio 2 na seccao de verificacao do bloco.
#
#   exposta                  ha metrica e ha processo que a serve
#   declarada_nao_exposta    ha metrica em codigo; nenhum processo a serve
#   inexistente              nao ha metrica, e o credor esta nomeado

series_do_criterio_2:
  - serie: mensagens recebidas
    estado: exposta
    metricas:
      - gwy_requests_total
    nota: >-
      Sem etiqueta de tenant, pelas emendas 1.21 e 1.25. O por-tenant sai de
      consulta SQL.

  - serie: mensagens enviadas
    estado: declarada_nao_exposta
    metricas: []
    nota: >-
      `outbound_sent_total{kind}` existe em
      `packages/core-ts/src/outbound/metricas.ts` e **nenhum servico importa o
      modulo** (medido). Credor: o ticket que ligar o estagio de saida (KAM-015).

  - serie: latencia de ingress
    estado: exposta
    metricas:
      - gwy_enqueue_ms
    nota: E um *gauge* do ultimo enfileiramento, nao um histograma.

  - serie: latencia de resposta (p50/p95/p99)
    estado: declarada_nao_exposta
    metricas:
      - agr_turn_latency_ms
    nota: >-
      **O p95 nao e computavel.** O AGR nao tem histogramas, por decisao do
      ADR-018 escrita em `metricas.py`; o `agr_turn_latency_ms` e o valor do
      ultimo turno. Um quantil exige `_bucket`, que so os modulos `avisos` e
      `coexistencia` tem. **Credor: o fundador**, e nao o KAM-082 como esta linha
      dizia ate 2026-11-06. O KAM-082 era o credor obvio — e quem precisa do
      quantil — e mediu, ao operacionaliza-lo, que nao e trabalho de execucao:
      dar histogramas ao AGR contraria o **ADR-018** («observabilidade leve»),
      escrito no proprio `metricas.py`, e separar texto de voz exige uma etiqueta
      de modalidade que nao existe, o que e emenda ao dicionario. Duas decisoes
      de canon. A definicao do SLI, com numerador e denominador, fica em
      `../slo.md` §2.2 linha 4 a espera dessa decisao.

  - serie: fila (profundidade e idade do mais antigo)
    estado: exposta
    metricas:
      - inbound_queue_depth
      - agr_queue_depth
    nota: >-
      **So a profundidade.** A idade do mais antigo — que e o predicado do §9.2 —
      nao tem serie. Esta nota dizia que vivia no `evt_outbox_lag_seconds`, «servido
      pelo publicador, que nao esta em nenhum Dockerfile nem compose» (credor
      KAM-005). O publicador corre e e raspado desde o KAM-187 (`job` publicador),
      mas aquela serie e o atraso do *outbox* e nao a idade do mais antigo na
      `wa-inbound`: continua sem serie que responda a esta linha.

  - serie: handoff
    estado: exposta
    metricas:
      - agr_handoff_total
    nota: >-
      O lado do AGR. O `hnd_handoff_total` do modulo `hnd` continua sem servico
      que o importe.

  - serie: callbacks (ok/falhados/reconciliados)
    estado: declarada_nao_exposta
    metricas: []
    nota: >-
      `hnd_callback_rejeitado_total{motivo}` existe e o modulo `hnd` nao e
      importado por nenhum servico. «Reconciliados» nao tem metrica nenhuma.

  - serie: custo LLM
    estado: declarada_nao_exposta
    metricas: []
    nota: >-
      `meta_cost_usd_total` e `meta_cost_usd_estimate` existem; o modulo
      `metering` nao e importado por nenhum servico. O custo por tenant sai de
      consulta, e **nao** de etiqueta: desde o KAM-081, da vista
      `platform.v_tenant_cost_daily` (LLM e Meta por tenant, dia e rubrica),
      que os paineis `custo-por-tenant` e `unit-economics` leem por SQL.

  - serie: erros Meta 130429 e 131049
    estado: inexistente
    metricas: []
    nota: >-
      Nao ha metrica indexada por codigo de erro da Meta. O que existe e o
      `outbound_rate_limited_total{origem="meta"}`, que conta um `130429` que o
      *backoff* repetiu — e nao cobre o `131049`, que nao repete. Uma metrica
      `{codigo}` com dominio fechado nos tres codigos do `E1` seria admissivel
      pelo `OBS-I`; escreve-la exige mexer no `outbound/adapter.ts` e uma emenda
      ao dicionario, e nenhum dos dois cabe neste ticket.

  - serie: quality_rating
    estado: declarada_nao_exposta
    metricas: []
    nota: >-
      `channel_quality{rating}` existe no modulo `qualidade`, com dominio fechado
      em tres — e o exemplo que o dicionario usa para explicar o `OBS-I`. Sem
      servico que importe o modulo.

  - serie: idade do WAL
    estado: declarada_nao_exposta
    metricas:
      - backup_wal_idade_segundos
    nota: >-
      **Mudou de `inexistente` com o KAM-079, e o que falta mudou com ela.** A
      metrica existe em `libs/py-core/src/kamba_core/backup/metricas.py`, com o
      limite de 300 s, a severidade P1 e o RB-K08 fixados em dado no
      `infra/backup/cobertura.yaml`. **Nenhum processo a serve**, e a razao e a
      mesma por tres niveis: servi-la exige o pgBackRest a correr, que exige um
      `repo1` alcancavel, que exige a **D1/KAM-105** decidida. Nao se escreve a
      regra de alerta por isso — ver `regras_por_escrever`.

  - serie: memoria e CPU por servico
    estado: inexistente
    metricas: []
    nota: >-
      Nao ha *exporter* de contentores (cAdvisor ou equivalente) em nenhum
      compose. O Prometheus so expoe as suas proprias. Acrescentar um contentor
      de *exporter* e um servico novo no conjunto reduzido, que e materia do
      manifesto e nao deste ficheiro.

# ------------------------------------------------- regras que faltam escrever
#
# Oito das doze regras do `docs/tecnica/09` §9.2 **nao se escrevem hoje**, e a
# razao e sempre a mesma: nao ha metrica que o processo sirva.
#
# **Nao se escrevem como YAML inerte de proposito.** Uma regra sobre uma serie
# que ninguem produz nunca dispara, e um alerta que nunca dispara parece
# cobertura — e e pior do que a sua ausencia, porque ninguem volta a olhar. E a
# mesma leitura com que o KAM-076 recusou um `scrape_config` para um `/metrics`
# inexistente: «um alvo que raspa um `/metrics` que ainda nao existe produz um
# `up 0` permanente, e um painel cheio de alvos em baixo ensina a equipa a
# ignorar o painel».

regras_por_escrever:
  - alerta: DLQ de payment.* (qualquer entrada aberta)
    severidade: P1
    runbook: RB-K02
    falta: >-
      a serie existe (`evt_dlq_open{tipo="payment.confirmed"}`, servida pelo
      publicador do worker-canal) e a classificacao Sev1 tambem (o prefixo
      `payment.` esta nos PREFIXOS_SEV1 do dlq.ts, e o criterio 7 do KAM-055
      exige o alerta); o que falta e a **regra**, que e deste ficheiro e nao do
      consumidor
    credor: KAM-080

  - alerta: callbacks (falhas HMAC > 3/h ou pagamento por reconhecer)
    severidade: P1
    runbook: RB-K02
    falta: hnd_callback_rejeitado_total sem servico que a sirva
    credor: o ticket que ligar o modulo hnd

  - alerta: sinal de anomalia de pagamento com severidade >= 3
    severidade: P1
    runbook: RB-K02
    falta: >-
      a serie existe e e **servida** — o `fraud_signals_total{regra}` sai no
      `/metrics` do processo de pagamentos do COM —, e o que lhe falta e ser
      **alcancavel**: o `scrape_config` do `com` aponta para a 3002 (medido em
      `infra/compose/prometheus/prometheus.yml`) e aquele processo serve na
      3013. E a mesma lacuna que o `com_payment_to_paid_seconds` do KAM-055 tem,
      e esta registada no `specs/EPIC-08` com credor KAM-080.
      **E ha uma segunda falta, e e a que vem primeiro:** nenhum processo corre o
      motor. As quatro camadas estao medidas — o motor, a porta de escrita, o
      contador servido e a raiz de composicao — e falta o condutor, um *job* que
      chame o `correrMotorDeAnomalias` por tenant. Isto e, as oito series saem a
      zero hoje por falta de **produtor** e nao de alcance, e corrigir o alvo
      sozinho nao as enche. Escrever a regra agora produzia um alerta sobre uma
      serie que ninguem raspa **e** que ninguem alimenta — que este ficheiro
      trata por pior do que a ausencia dele. Nasce no dia em que houver os dois.
    credor: KAM-080

  - alerta: orfao de pagamento aberto ha mais de 24 h
    severidade: P1
    runbook: RB-K02
    falta: >-
      o criterio 3 do KAM-060 pede a metrica «orfaos abertos > 24 h» e o motor
      ja a calcula — o `orfaosAbertos` do `RelatorioDeAnomalias`, com a idade de
      cada orfao no `detalhe` do sinal —, mas ela nao e uma **serie**: o
      `fraud_signals_total` conta sinais e nao mede idades, e um *gauge* de
      idade precisa de um processo que o publique periodicamente. O motor corre
      em lote (`kamba_batch`) e nao tem `/metrics` proprio; quem o ligar a um
      publicador fecha esta regra e o painel de orfaos ao mesmo tempo.
    credor: KAM-080

  # As duas do backup mudaram com o KAM-079, e o que mudou foi **o que falta**.
  # Antes faltava a metrica; hoje ela existe e falta o processo que a sirva.
  # Nao e uma distincao de forma: a metrica era trabalho deste repositorio, e o
  # processo que a serve depende de uma decisao que nao e de engenharia.
  - alerta: WAL (ultimo arquivo > 5 min)
    severidade: P1
    runbook: RB-K08
    falta: >-
      ha `backup_wal_idade_segundos` declarada (KAM-079) e **nenhum processo a
      serve**: servi-la exige o pgBackRest a correr, que exige um `repo1`
      alcancavel. O limite (300 s), a severidade e o runbook estao fixados em
      `infra/backup/cobertura.yaml` e o `tools/backup_lint` confronta-os com
      esta entrada
    credor: KAM-079

  - alerta: restauro mensal falhado
    severidade: P2
    runbook: RB-K08
    falta: >-
      ha `backup_restauro_desfecho_total{desfecho}` declarada (KAM-079) e
      nenhum processo a serve; e **nao ha agendador** no repositorio (medido:
      sem `cron`, `repeat:` nem `delay:`), pelo que nao ha *job* mensal que
      produza o desfecho. O predicado `restauro_devido` existe e e chamavel
    credor: KAM-079 (a metrica e o predicado); KAM-071/KAM-078 (o agendador)

  - alerta: quality rating (amarelo P3, vermelho P1)
    severidade: P1/P3
    runbook: RB-K04
    falta: channel_quality sem servico que a sirva
    credor: o ticket que ligar o modulo qualidade

  - alerta: free tier (80% P3, 100% P2)
    severidade: P2/P3
    runbook: RB-K05
    falta: meta_free_tier_used_ratio sem servico que a sirva
    credor: KAM-023

  - alerta: account_update (PARTNER_REMOVED etc.)
    severidade: P2
    runbook: RB-K06
    falta: channel_disconnected_total sem servico que a sirva
    credor: o ticket que ligar o modulo coexistencia

  - alerta: segredo a expirar (< 14 dias)
    severidade: P3
    runbook: RB-K07
    falta: >-
      o `ops/secrets-inventory.yaml` tem o `rotacao_dias` e nao ha nada que o
      leia e publique a idade de cada segredo
    credor: KAM-072

  - alerta: memoria (> 80% sustentada)
    severidade: P3
    runbook: >-
      **nenhum.** O §9.2 escreve «Escalar» nesta linha, e nao um RB-K. E a unica
      das doze sem runbook, o que a poe em conflito com a regra «alerta sem
      runbook e removido» do mesmo §9.2 e com o criterio 4 deste ticket, que
      exige `runbook_url` em todas. Nao se resolve aqui: criar um RB-K11 excede
      os dez *stubs* que o ticket manda criar, e reaproveitar um dos dez seria
      apontar um alerta de capacidade para um runbook que nao fala dela.
    falta: nao ha *exporter* de contentores
    credor: a decisao do runbook e de quem governa o §9.2
