# Lexicon de marcadores de portugues do Brasil nas legendas — KAM-121.
#
# Partilhado com o KAM-125 (golden PT-AO). SemVer: o conteudo e selado em
# `versoes.lock`, e o gate 4 recusa um conteudo que mude sem a `versao` subir
# (`services/agr/tests/test_social_dono.py`, `TestPoliticasSeladas`).
#
# O QUE ESTE FICHEIRO E.
#
# **Proposta**, e nao um levantamento: as entradas vem do proprio bloco do
# ticket («celular», «voce», «onibus», «tela») e de conhecimento geral da
# variante europeia/angolana, e nao de ocorrencias contadas em legendas reais
# de PME angolanas. Nenhuma entrada aqui foi revista por um falante angolano:
# isso e o criterio 3 do bloco (dois revisores, >= 85% «naturais»), NAO
# VERIFICADO ate medir. A grafia segue a do conjunto (pre-acordo de 1990:
# «accao», «facto», «optimo»), que e a convencao deste repositorio; se a grafia
# oficial em Angola e esta e INDICIO, e confirma-se com os mesmos revisores.
#
# Como se le uma entrada:
#
# * `padrao`: expressao regular sobre o texto **original**, sem distinguir
#   maiusculas, com fronteiras de palavra ja postas pelo leitor (`\b...\b`);
# * `correccao`: o texto que a substitui, ou `null` quando a correccao depende
#   da frase e nao se faz a maquina — a legenda volta ao gerador uma vez com o
#   marcador nomeado e, se o trouxer outra vez, nao se entrega;
# * `tipo`: `vocabulario`, `grafia` ou `gerundio`. No `gerundio` a correccao e
#   a regra `estar + a + infinitivo`, e nao um texto;
# * `nota`: a razao, quando a entrada nao e obvia.
#
# Ficam DE FORA, de proposito, palavras com dois sentidos no comercio angolano:
# «fato» (em PT-AO e tambem a roupa), «legal» (licito), «beleza» (a categoria),
# «grama», «massa», «cara», «moca», e o «pro» (que casava «pro-activo»).
# Corrigi-las estragava legendas certas.

