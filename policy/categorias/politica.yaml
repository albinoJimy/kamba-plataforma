# Politica de categorias do screening — KAM-088.
#
# A lista de bloqueio e a **uniao Meta ∪ lei angolana** (`docs/tecnica/10`
# §8.1), como *policy-as-code* versionada. Este ficheiro e a fonte; o modulo
# `packages/core-ts/src/screening/politica.gerada.ts` gera-se dele com
#
#     python -m politica_categorias gerar      # com tools/ no PYTHONPATH
#
# e o gate 4 recusa um gerado que nao corresponda a fonte, uma fonte que nao
# cumpra `politica.esquema.json`, e um conteudo que mude sem a `versao` subir
# (`versoes.lock`). E um **artefacto comportamental**: cada decisao grava a
# `versao` com que foi tomada, e mudar a versao dispara a re-analise do
# catalogo publicado.
#
# O QUE ESTE FICHEIRO NAO DECIDE.
#
# **O conteudo juridico.** Cada `fonte_lei` leva o estado que o E3 §5 lhe da e
# esta *(a confirmar por parecer)*: nenhuma leitura nossa de uma lei angolana e
# definitiva, e um NAO VERIFICADO aqui nao passa a facto por estar num ficheiro
# que o CI le. O que este ficheiro implementa por inteiro e a lista da **Meta**,
# publicada e citada no repositorio (E1 §4, CONFIRMADO, lida a 23 Set 2026).
#
# **O lexicon PT-AO de ocorrencias reais.** O criterio 3 pede-o construido de um
# *dataset*, e o repositorio nao tem nenhum com anuncios reais de PME angolanas.
# Os termos locais desta versao (marcas e bebidas tradicionais) sao **proposta**:
# vem do proprio bloco do ticket (o `cuc@` dos casos adversariais) e de
# conhecimento geral, nao de ocorrencias contadas. Ficam marcados com
# `# proposta PT-AO` e o credor e o dataset do Piloto (`specs/EPIC-09` §KAM-088,
# verificacao).
#
# Como se le uma entrada:
#
# * `decisao`: `bloqueada` e final (nem o LLM nem um humano a descem);
#   `condicional` vai a revisao humana; `permitida` so conta quando casa a
#   **categoria declarada** — num texto de produto, um termo de `permitida` nao
#   desbloqueia nada.
# * `termos`: comparados depois da normalizacao (minusculas, sem acentos, *leet*,
#   letras repetidas colapsadas, separadores e *emojis*). Um termo com cinco ou
#   mais letras tambem casa com o texto compactado (sem espacos), que e o que
#   apanha `w h i s k y` e `cer-veja`; um termo mais curto so casa palavra a
#   palavra, porque `arma` dentro de `armario` e um falso positivo certo.
# * `padroes`: expressoes regulares sobre o texto normalizado, por palavras.
#   Entre plicas e sem escapes interpretados (`tools/kamba_yaml.py`): o que esta
#   escrito e o que o motor compila.

