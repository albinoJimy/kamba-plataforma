# Politica de alegacoes das legendas do modulo social — KAM-121, criterio 6.
#
# SemVer: o conteudo e selado em `versoes.lock`, e o gate 4 recusa um conteudo
# que mude sem a `versao` subir (`TestPoliticasSeladas`). Os casos `allow/deny`
# estao em `casos.jsonl` (>= 100, criterio 6) e correm no gate 4 pelo mesmo
# ensaio — o gate 12 do `01` §4, que o criterio nomeia, ainda nao existe
# (`docs/ci.md`: «12–18 fora de âmbito»), e e o credor que os ha-de correr.
#
# O QUE ESTE FICHEIRO NAO DECIDE.
#
# **O conteudo juridico.** A base de cada regra e a leitura nossa da Lei de
# Defesa do Consumidor (Lei 15/03, publicidade enganosa) e das politicas de
# publicidade da Meta sobre alegacoes de saude. Nenhuma leitura nossa de uma lei
# angolana e definitiva: cada `estado` aqui e INDICIO *(a confirmar por parecer)*,
# e uma regra nao passa a facto por estar num ficheiro que o CI le. Os padroes
# sao **proposta**: nao vem de um corpus de anuncios reais.
#
# Como se le uma entrada:
#
# * `padroes`: expressoes regulares sobre o texto **normalizado** (minusculas,
#   sem acentos, espacos colapsados). Basta uma casar para a regra casar;
# * `permitido_se_nos_factos`: `true` quando a mesma alegacao, dita pelo dono
#   num facto autorizado do perfil, a deixa passar («premiado pela Feira X» so
#   se o dono o disse). O que se compara e o pedaco que casou, normalizado,
#   contra os factos normalizados. `false` quando nem o dono a autoriza — uma
#   cura nao passa a verdade por o dono a escrever;
# * `estado` e `fonte`: a escala de tres estados do conjunto, e de onde vem.

versao: "1.0.0"
estado: proposta

regras:
  - id: cura
    descricao: "promessa de cura, tratamento ou prevencao de doenca, e emagrecimento com numero"
    permitido_se_nos_factos: false
    estado: INDICIO
    fonte: "Lei 15/03 (publicidade enganosa) e politica de publicidade da Meta sobre saude, a confirmar por parecer"
    padroes:
      - "\\b(cura|curam|curar)\\s+(a|o|as|os|tudo|para|de vez)\\b"
      - "\\bcura (garantid|definitiv|natural|rapid|total)"
      - "\\b(efeito|poder|propriedades?) curativ"
      - "\\b(trata|tratar|combate|combater|previne|prevenir|elimina|eliminar|acaba com)\\s+(a|o|as|os)?\\s*(diabetes|cancro|cancer|hipertensao|tensao alta|paludismo|malaria|hiv|sida|covid|infecc\\w*|doenc\\w*|virus|bacteria\\w*|anemia|asma)"
      - "\\bmilagr"
      - "\\b(emagrec\\w*|perca|perder|perde)\\s+\\d+\\s*(kg|quilos)"
      - "\\bsubstitui\\s+(o|os)?\\s*(medicamento|remedio|medico)"
  - id: garantia_absoluta
    descricao: "garantia absoluta de resultado"
    permitido_se_nos_factos: false
    estado: INDICIO
    fonte: "Lei 15/03 (publicidade enganosa), a confirmar por parecer"
    padroes:
      - "\\b100\\s*(%|por cento)\\s*(garantid|eficaz|seguro|eficiente|infalivel)"
      - "\\bgarantia (total|absoluta)"
      - "\\bresultados?\\s+garantid"
      - "\\bsem (nenhum )?riscos?\\b"
      - "\\bnunca falha"
      - "\\bfunciona sempre"
      - "\\binfalivel"
  - id: superlativo_nao_comprovado
    descricao: "superlativo que a loja nao pode provar"
    permitido_se_nos_factos: true
    estado: INDICIO
    fonte: "Lei 15/03 (publicidade enganosa), a confirmar por parecer"
    padroes:
      - "\\b(o|a|os|as) (melhor|melhores|mais barat[oa]s?)( \\w+){0,3} (de|do|da|em) (angola|luanda|todo o pais|pais|mundo|cidade|bairro|mercado|africa)"
      - "\\bnumero (um|1)\\b"
      - "\\bn\\.?\\s*o?\\s*1\\b"
      - "\\bimbativel"
      - "\\binigualavel"
      - "\\bsem concorrencia"
      - "\\blider(es)? (de|do|no) mercado"
      - "\\b(o|a) unic[oa]( \\w+){0,2} (que|em|de|com)\\b"
  - id: comparacao_com_concorrente
    descricao: "comparacao com concorrentes nomeados ou apontados"
    permitido_se_nos_factos: false
    estado: INDICIO
    fonte: "Lei 15/03 (publicidade comparativa), a confirmar por parecer"
    padroes:
      - "\\b(melhor|melhores|mais barat[oa]s?|mais rapid[oa]s?|mais fresc[oa]s?|superior(es)?|mais bonit[oa]s?|mais fortes?|mais duradour[oa]s?|mais saboros[oa]s?)\\s+(do\\s+)?que\\s+(a|o|os|as|na|no|nas|nos|qualquer)?\\s*\\w"
      - "\\bao contrario d(a|o|as|os)\\s+\\w"
      - "\\bsuperior(es)? a(o|os|a|as)?\\s+\\w"
      - "\\bconcorrente"
      - "\\bconcorrencia\\b"
  - id: selo_ou_certificacao
    descricao: "selo, certificacao, premio ou recomendacao que nao esta nos factos do dono"
    permitido_se_nos_factos: true
    estado: INDICIO
    fonte: "Lei 15/03 (publicidade enganosa), a confirmar por parecer"
    padroes:
      - "\\bcertificad[oa]s?\\b"
      - "\\bcertificacao\\b"
      - "\\biso\\s*\\d{3,5}"
      - "\\baprovad[oa]s? pel[oa]s?\\s+\\w"
      - "\\bselo de (qualidade|garantia)"
      - "\\bpremiad[oa]s?\\b"
      - "\\brecomendad[oa]s? por (medicos|dentistas|especialistas|nutricionistas|dermatologistas)"
      - "\\b(testado dermatologicamente|dermatologicamente testado)"
      - "\\bclinicamente (provado|testado|comprovado)"
      - "\\bhalal\\b"
      - "\\b(homologad[oa]s?|registad[oa]s? no ministerio)"
      - "\\bautorizad[oa]s? pel[oa] (ministerio|inadec|arsea|agt|bna)"
